name: Amy FX Honesty Audit Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - 'tools/amyfx-honesty-audit/**'
      - 'app/src/main/assets/apps/mapping/js/audit/**'
      - 'app/src/main/assets/apps/mapping/js/main.js'
      - '.github/workflows/honesty-audit-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python audit harness
        run: |
          python -m py_compile \
            tools/amyfx-honesty-audit/audit_core.py \
            tools/amyfx-honesty-audit/run_audit.py

      - name: Run honesty invariant tests
        run: python -m unittest discover -s tools/amyfx-honesty-audit/tests -v

      - name: Check browser audit module syntax
        run: node --check app/src/main/assets/apps/mapping/js/audit/honesty-audit-export.js
