name: Preview Source Polish

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - scripts/apply-preview-mapping-polish.py
      - .github/workflows/preview-source-polish.yml

permissions:
  contents: write

jobs:
  polish-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Apply one-time Mapping polish
        run: python3 scripts/apply-preview-mapping-polish.py

      - name: Run focused Node regression
        run: |
          node --test \
            tests/closed-candle-aggregation.test.mjs \
            tests/six-issues-regression.test.mjs \
            tests/closed-candle-freshness-adapter.test.mjs

      - name: Commit source and remove temporary runner
        run: |
          rm -f scripts/apply-preview-mapping-polish.py
          rm -f .github/workflows/preview-source-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mapping): complete closed-candle scalper polish [skip ci]"
          git push origin HEAD:personal/amyfx-private
