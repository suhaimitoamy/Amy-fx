name: Repair Mapping Break And Candle Truth

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-repair-mapping-break-candle-truth.yml

permissions:
  contents: write

jobs:
  repair-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"

      - name: Apply robust Mapping truth patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/repair-mapping-truth.py

      - name: Remove temporary repair files before integration audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-repair-mapping-break-candle-truth.yml
          rm -f tools/repair-mapping-truth.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/mapping/js/engine/closed-candle-source-state.js
          node --check app/src/main/assets/apps/mapping/js/engine/timeframe-analysis-contract.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/integrity/mapping-integrity-core.js
          node --check app/src/main/assets/apps/mapping/js/mapping-integrity.js
          node --check app/src/main/assets/apps/mapping/js/closed-candle-freshness-adapter-v1.js
          node --test \
            tests/closed-candle-source-state.test.mjs \
            tests/mapping-break-and-timeframe-truth.test.mjs \
            tests/bos-mss.test.mjs \
            tests/closed-candle-aggregation.test.mjs

      - name: Run full JavaScript regression
        run: timeout 25m npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android unit test, lint, and debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Commit validated Preview repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-time-repair-mapping-break-candle-truth.yml
          test ! -e tools/repair-mapping-truth.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(preview): repair break detection and candle truth [skip ci]"
          git push origin HEAD:personal/amyfx-private
