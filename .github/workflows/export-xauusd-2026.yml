name: Export XAUUSD 2026 candles

on:
  push:
    branches:
      - data/xauusd-2026-export
    paths:
      - tools/export_xauusd_2026.py
      - .github/workflows/export-xauusd-2026.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exporter branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exporter dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download and package candles
        run: python tools/export_xauusd_2026.py

      - name: Upload monthly ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-2026-january-to-july
          path: |
            artifacts/xauusd-2026/*.zip
            artifacts/xauusd-2026/*manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
