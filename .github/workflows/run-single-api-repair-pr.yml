name: Run Single API Repair PR

on:
  pull_request:
    branches: [personal/amyfx-private]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: run-single-api-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-preview-repair:
    if: ${{ github.event.pull_request.head.ref == 'fix/preview-market-pipeline-single-api-20260730' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical one-provider repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = subprocess.check_output(['git','show','origin/main:.github/workflows/apply-market-pipeline-fix.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0: raise SystemExit('Canonical patch start marker missing')
          start += len(marker)
          end = workflow.find("\n          PY\n", start)
          if end < 0: raise SystemExit('Canonical patch end marker missing')
          raw = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          script = '\n'.join(lines) + '\n'
          scanner_start = script.find("scanner_path = Path('app/src/main/java/com/amyelitesuite/ScannerService.kt')")
          scanner_end = script.find('if preview:', scanner_start)
          if scanner_start < 0 or scanner_end < 0: raise SystemExit('Scanner patch boundaries missing')
          scanner_stub = "scanner_path = Path('app/src/main/java/com/amyelitesuite/ScannerService.kt')\nscanner = read(scanner_path)\nif 'Legacy local Mapping scanner is retired.' not in scanner:\n    raise SystemExit('Expected retired native scanner compatibility stub')\n\n"
          script = script[:scanner_start] + scanner_stub + script[scanner_end:]
          Path('/tmp/apply-single-api-fix.py').write_text(script, encoding='utf-8')
          PY
          GITHUB_REF_NAME="${{ github.event.pull_request.head.ref }}" python3 /tmp/apply-single-api-fix.py
          cat > tests/market-single-api-freshness.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { dedupeCandleRows } from '../lib/market-candle-store.mjs';
          const read = path => readFileSync(new URL(`../${path}`, import.meta.url), 'utf8');
          test('live quote stays on one backend API and uses provider freshness', () => {
            const source = read('app/src/main/assets/apps/mapping/js/api/market-data.js');
            assert.match(source, /const LIVE_POLL_MS = 20_000/);
            assert.match(source, /validateLiveMarketPayload\(data\)/);
            assert.match(source, /data\?\.quoteCapturedAt/);
            assert.match(source, /assertBackendPayloadFresh\(data, `Candle \${tf}`\)/);
            assert.doesNotMatch(source, /lastWsTickAt = Date\.now\(\)/);
            assert.doesNotMatch(source, /new WebSocket|twelve_api_key/);
          });
          test('duplicate candle keys collapse before Supabase upsert', () => {
            const rows = dedupeCandleRows([
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 10, close: 1 },
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 10, close: 2 },
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 11, close: 3 }
            ]);
            assert.equal(rows.length, 2);
            assert.equal(rows.find(row => row.open_time === 10).close, 2);
          });
          test('native Mapping scanner remains safely retired', () => {
            const source = read('app/src/main/java/com/amyelitesuite/ScannerService.kt');
            assert.match(source, /Legacy local Mapping scanner is retired/);
            assert.doesNotMatch(source, /pollMarket\(/);
          });
          TEST
          rm -f .github/workflows/run-single-api-repair-pr.yml .single-api-fix-trigger
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --test tests/market-single-api-freshness.test.mjs
          timeout 20m npm test
      - name: Commit Preview repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(private): reject stale market data on one backend API [single-api-applied]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
