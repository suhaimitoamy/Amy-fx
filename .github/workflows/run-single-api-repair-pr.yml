name: Run Single API Repair PR

on:
  pull_request:
    branches: [personal/amyfx-private]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: run-single-api-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-preview-repair:
    if: ${{ github.event.pull_request.head.ref == 'fix/preview-market-pipeline-single-api-20260730' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical one-provider repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = subprocess.check_output(['git','show','origin/main:.github/workflows/apply-market-pipeline-fix.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0: raise SystemExit('Canonical patch start marker missing')
          start += len(marker)
          end = workflow.find("\n          PY\n", start)
          if end < 0: raise SystemExit('Canonical patch end marker missing')
          raw = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          script = '\n'.join(lines) + '\n'
          scanner_start = script.find("scanner_path = Path('app/src/main/java/com/amyelitesuite/ScannerService.kt')")
          scanner_end = script.find('if preview:', scanner_start)
          if scanner_start < 0 or scanner_end < 0: raise SystemExit('Scanner patch boundaries missing')
          scanner_stub = "scanner_path = Path('app/src/main/java/com/amyelitesuite/ScannerService.kt')\nscanner = read(scanner_path)\nif 'Legacy local Mapping scanner is retired.' not in scanner:\n    raise SystemExit('Expected retired native scanner compatibility stub')\n\n"
          script = script[:scanner_start] + scanner_stub + script[scanner_end:]
          Path('/tmp/apply-single-api-fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-single-api-fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/market-single-api-freshness.test.mjs')
          text = path.read_text(encoding='utf-8')
          start = text.find("test('native scanner rejects stale backend responses'")
          end = text.find('\n          });', start)
          if start < 0 or end < 0: raise SystemExit('Generated scanner test block missing')
          end += len('\n          });')
          replacement = """test('native scanner remains safely retired', () => {
            const source = read('app/src/main/java/com/amyelitesuite/ScannerService.kt');
            assert.match(source, /Legacy local Mapping scanner is retired/);
            assert.doesNotMatch(source, /pollMarket\\(/);
          });"""
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm -f .github/workflows/run-single-api-repair-pr.yml .single-api-fix-trigger
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --test tests/market-single-api-freshness.test.mjs
          timeout 20m npm test
      - name: Commit Preview repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(private): reject stale market data on one backend API [single-api-applied]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
