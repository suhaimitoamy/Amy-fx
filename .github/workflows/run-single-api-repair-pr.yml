name: Run Single API Repair PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: run-single-api-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-public-repair:
    if: ${{ github.event.pull_request.head.ref == 'fix/market-pipeline-single-api-20260730' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical one-provider repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap
          workflow = subprocess.check_output(['git','show','origin/main:.github/workflows/apply-market-pipeline-fix.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0: raise SystemExit('Canonical patch start marker missing')
          start += len(marker)
          end = workflow.find("\n          PY\n", start)
          if end < 0: raise SystemExit('Canonical patch end marker missing')
          Path('/tmp/apply-single-api-fix.py').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          python3 /tmp/apply-single-api-fix.py
          rm -f .github/workflows/run-single-api-repair-pr.yml .single-api-fix-trigger
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --test tests/market-single-api-freshness.test.mjs
          timeout 20m npm test
      - name: Commit public repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reject stale market data on one backend API [single-api-applied]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
