name: Run Amy FX journal restore hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/amyfx-journal-restore-hotfix.yml
      - .github/workflows/amyfx-journal-restore-pr-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/amyfx-journal-restore-hotfix.yml').read_text(encoding='utf-8').splitlines()
          output = []
          inside = False
          for line in workflow:
              if line.strip() == "python3 <<'PY'":
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  output.append(line[10:] if line.startswith('          ') else line)
          if not output:
              raise SystemExit('Patch script tidak ditemukan')
          Path('/tmp/apply_hotfix.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_hotfix.py

      - name: Capture journal JavaScript syntax
        continue-on-error: true
        shell: bash
        run: node --check app/src/main/assets/apps/journal/app.js 2>&1 | tee HOTFIX_SYNTAX_RESULT.log

      - name: Commit generated hotfix for diagnosis
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f .github/workflows/amyfx-journal-restore-hotfix.yml
          rm -f .github/workflows/amyfx-journal-restore-pr-runner.yml
          rm -f HOTFIX_JOURNAL_RESTORE*.md
          git config user.name 'Amy FX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(journal): stage large backup restore patch'
          git push origin "HEAD:${HEAD_BRANCH}"
