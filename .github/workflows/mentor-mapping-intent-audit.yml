name: Amy FX Mentor Mapping Intent Audit

on:
  push:
    branches:
      - fix/preview-mentor-mapping-intent-final-20260727
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Mark audit pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state='pending' \
            -f context='Amy FX Mentor Mapping Intent Audit' \
            -f description='Running full Preview regression and Android checks' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mentor runtimes
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/shared/amyfx-provider-detection-v1.js
          node --check app/src/main/assets/apps/shared/amyfx-mentor-mapping-intent-hotfix-v1.js
          node --test --test-force-exit tests/mentor-mapping-intent-hotfix.test.mjs
      - name: Run all JavaScript regression tests
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android unit, lint, and release compile
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon --no-configuration-cache
      - name: Mark audit success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state='success' \
            -f context='Amy FX Mentor Mapping Intent Audit' \
            -f description='JavaScript and Android audit passed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Mark audit failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state='failure' \
            -f context='Amy FX Mentor Mapping Intent Audit' \
            -f description='Audit failed; inspect workflow logs' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
