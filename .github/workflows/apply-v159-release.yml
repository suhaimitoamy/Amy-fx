name: Apply Amy FX 1.5.9 Freeze Fix Release

on:
  push:
    branches:
      - fix/journal-navigation-freeze-v1.5.9

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-navigation-freeze-v1.5.9
          fetch-depth: 0

      - name: Update release workflows and notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_paths = [
              Path('.github/workflows/build-apk.yml'),
              Path('.github/workflows/build-release.yml'),
              Path('.github/workflows/stage5-apply.yml'),
          ]
          for path in workflow_paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.5.8', '1.5.9')
              text = re.sub(r'(?<!\d)49(?!\d)', '50', text)
              if path.name == 'build-apk.yml':
                  text = re.sub(
                      r'release_notes="Amy FX 1\.5\.9[^\n]*"',
                      'release_notes="Amy FX 1.5.9 memperbaiki freeze pada menu Trading Library/Jurnal akibat loop pembaruan DOM, memulihkan klik menu samping dan navigasi Library, Media, Jurnal, serta Asisten, sambil mempertahankan data backup jurnal dan rotasi API AI."',
                      text,
                      count=1,
                  )
                  text = re.sub(
                      r"          notes = \[\n.*?\n          \]",
                      """          notes = [
              'Freeze pada Trading Library dan Jurnal akibat loop pembaruan DOM telah dihentikan.',
              'Menu samping serta navigasi Library, Media, Jurnal, dan Asisten kembali dapat diklik.',
              'Pemulihan jurnal tetap membaca data backup yang sudah tersimpan di IndexedDB.',
              'Kalender tetap menampilkan nominal Win hijau dan Loss merah.',
              'Rotasi otomatis API Gemini dan OpenRouter tetap tersedia dengan timeout dan cooldown.',
              'DeepSeek tetap tersedia sebagai fallback berbayar opsional.',
              'Package com.amyelitesuite, sertifikat permanen, data lokal, dan jalur update tetap dipertahankan.',
              'Pembaruan dapat dipasang tanpa menghapus aplikasi.'
          ]""",
                      text,
                      count=1,
                      flags=re.S,
                  )
              path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'> \*\*Versi:\*\* `[^`]+`', '> **Versi:** `1.5.9`', readme, count=1)
          readme = re.sub(r'> \*\*Version code:\*\* `\d+`', '> **Version code:** `50`', readme, count=1)
          heading = '## Update v1.5.9 — Perbaikan Freeze Navigasi Jurnal'
          if heading not in readme:
              section = (
                  '\n## Update v1.5.9 — Perbaikan Freeze Navigasi Jurnal\n\n'
                  '- Loop pembaruan DOM yang membuat halaman Trading Library/Jurnal membeku telah dihentikan.\n'
                  '- Tombol menu, Library, Media, Jurnal, dan Asisten kembali dapat diklik.\n'
                  '- Jurnal hasil restore tetap dibaca dari IndexedDB dan tidak dihapus.\n'
                  '- Nominal Win/Loss serta rotasi API AI tetap dipertahankan.\n'
              )
              anchor = re.search(r'\n## Update v', readme)
              readme = readme[:anchor.start()] + section + readme[anchor.start():] if anchor else readme + section
          readme_path.write_text(readme, encoding='utf-8')

          release = Path('release-notes/1.5.9.md')
          release.parent.mkdir(parents=True, exist_ok=True)
          release.write_text(
              '# Amy FX 1.5.9\n\n'
              '- Memperbaiki freeze pada Trading Library dan Jurnal.\n'
              '- Memulihkan klik menu samping serta navigasi Library, Media, Jurnal, dan Asisten.\n'
              '- Jurnal hasil backup tetap dibaca dari IndexedDB.\n'
              '- Nominal Win/Loss dan rotasi API AI tetap dipertahankan.\n',
              encoding='utf-8',
          )

          Path('.github/workflows/apply-v159-release.yml').unlink()
          PY

      - name: Validate release changes
        run: |
          node --check app/src/main/assets/apps/journal/amy-journal-ai-runtime-fix.js
          node --check app/src/main/assets/apps/journal/amy-journal-final-fix.js
          npm test
          git diff --check

      - name: Commit Amy FX 1.5.9 release preparation
        run: |
          git config user.name "Amy FX Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Amy FX 1.5.9 freeze fix"
          git push origin HEAD:fix/journal-navigation-freeze-v1.5.9
