name: Amy FX Personal Source Repair

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/personal-source-repair.yml
      - tools/apply-personal-debug-fixes.mjs

permissions:
  contents: write

concurrency:
  group: amyfx-personal-source-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: personal/amyfx-private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply personal source fixes
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "personal/amyfx-private"
          node tools/apply-personal-debug-fixes.mjs

      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/update-checker.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/apps/market-intel/app.js
          node --check app/src/main/assets/apps/journal/app.js
          node --check app/src/main/assets/apps/academy/assets/js/auth.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/clock-sync.js
          node --check app/src/main/assets/apps/mapping/js/ui/ui-render.js

      - name: Run full JavaScript regression
        run: |
          set +e
          npm test > /tmp/amyfx-personal-repair-regression.log 2>&1
          status=$?
          cat /tmp/amyfx-personal-repair-regression.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/amyfx-personal-repair-regression.log /tmp/personal-source-repair-failure.txt
            git reset --hard HEAD
            cp /tmp/personal-source-repair-failure.txt personal-source-repair-failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add personal-source-repair-failure.txt
            git commit -m 'ci(private): capture source repair regression [skip ci]' || true
            git fetch origin personal/amyfx-private
            git rebase origin/personal/amyfx-private
            git push origin HEAD:personal/amyfx-private
            exit "$status"
          fi
          rm -f personal-source-repair-failure.txt

      - name: Run Android unit tests and lint
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Guard Supabase and Vercel files
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -E '^(supabase/|api/|lib/|vercel\.json$|\.vercel/)'; then
            echo 'Forbidden backend file change detected.'
            exit 1
          fi

      - name: Commit verified personal fixes
        run: |
          set -euo pipefail
          rm -f .github/workflows/personal-source-repair.yml tools/apply-personal-debug-fixes.mjs preview-regression-failure.txt personal-source-repair-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(private): repair Amy FX Preview logic and functions [skip ci]'
          git fetch origin personal/amyfx-private
          git rebase origin/personal/amyfx-private
          git push origin HEAD:personal/amyfx-private

# Retry after aligning personal Preview identity and WITA clock tests.
