name: Amy FX Preview Freeze Hotfix Audit

on:
  push:
    branches:
      - fix/preview-freeze-mentor-hotfix-20260727
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: amyfx-preview-freeze-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
      - name: Mark audit pending
        uses: actions/github-script@v7
        with:
          script: |
            const target = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Amy FX Preview Freeze Hotfix',
              description: 'Validating JavaScript and Android release gate',
              target_url: target
            })
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Preview stabilization
        run: python3 tools/apply-blueprint-preview.py
      - name: Run full JavaScript regression
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee preview-freeze-test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload JavaScript regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-freeze-test-log
          path: preview-freeze-test.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce JavaScript regression result
        if: steps.javascript.outputs.exit_code != '0'
        run: exit 1
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit test, lint, and release compile
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon --no-configuration-cache
      - name: Publish audit result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const target = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'Amy FX Preview Freeze Hotfix',
              description: success ? 'All regression and Android gates passed' : 'Freeze hotfix audit failed',
              target_url: target
            })
