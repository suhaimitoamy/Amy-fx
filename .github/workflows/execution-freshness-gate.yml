name: Execution Freshness Gate

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - scripts/apply-execution-freshness-gate.py
      - .github/workflows/execution-freshness-gate.yml

permissions:
  contents: write

concurrency:
  group: execution-freshness-gate
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Apply display and execution freshness split
        run: python3 scripts/apply-execution-freshness-gate.py

      - name: Run execution and closed-candle regression
        run: |
          node --test \
            tests/execution-plan.test.mjs \
            tests/six-issues-regression.test.mjs \
            tests/closed-candle-freshness-adapter.test.mjs

      - name: Commit source and remove temporary patch runner
        run: |
          rm -f scripts/apply-execution-freshness-gate.py
          rm -f .github/workflows/execution-freshness-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mapping): separate visible analysis from executable freshness [skip ci]"
          git push origin HEAD:personal/amyfx-private

# Trigger after workflow installation.
