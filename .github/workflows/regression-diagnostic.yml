name: Amy FX Regression Diagnostic

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - '.github/workflows/regression-diagnostic.yml'
      - 'app/src/main/assets/apps/mapping/js/**'
      - 'tools/amyfx-honesty-audit/**'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture complete regression output
        shell: bash
        run: |
          set +e
          npm test > /tmp/amyfx-regression.log 2>&1
          code=$?
          {
            echo "commit=$GITHUB_SHA"
            echo "exit_code=$code"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat /tmp/amyfx-regression.log
          } > tools/amyfx-honesty-audit/regression-diagnostic.log
          exit 0

      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name "amyfx-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/amyfx-honesty-audit/regression-diagnostic.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record honesty regression diagnostic [skip ci]"
          git push origin HEAD:personal/amyfx-private
