name: Apply Mapping Context Enhancements

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-mapping-context-enhancements.yml

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Preview branch only
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"

      - name: Write context enhancement modules
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/main/assets/apps/mapping/js/engine/market-session-clock.js <<'EOF'
          const DISPLAY_ZONE = 'Asia/Makassar';

          const SESSION_DEFINITIONS = Object.freeze({
            LONDON: Object.freeze({
              id: 'LONDON',
              label: 'London',
              timeZone: 'Europe/London',
              startMinute: 7 * 60,
              endMinute: 11 * 60
            }),
            NEW_YORK: Object.freeze({
              id: 'NEW_YORK',
              label: 'New York',
              timeZone: 'America/New_York',
              startMinute: 7 * 60 + 30,
              endMinute: 16 * 60
            })
          });

          function timestampMs(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return NaN;
            return number > 10_000_000_000 ? number : number * 1000;
          }

          function zonedParts(timestamp, timeZone) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hourCycle: 'h23'
            }).formatToParts(new Date(timestamp));
            const read = type => Number(parts.find(item => item.type === type)?.value || 0);
            return {
              year: read('year'),
              month: read('month'),
              day: read('day'),
              hour: read('hour'),
              minute: read('minute'),
              second: read('second')
            };
          }

          function sourceOffsetMinutes(timestamp, timeZone) {
            const observed = zonedParts(timestamp, timeZone);
            const observedAsUtc = Date.UTC(
              observed.year,
              observed.month - 1,
              observed.day,
              observed.hour,
              observed.minute,
              observed.second
            );
            return Math.round((observedAsUtc - timestamp) / 60000);
          }

          function sourceSeason(timestamp, timeZone) {
            const offset = sourceOffsetMinutes(timestamp, timeZone);
            if (timeZone === 'America/New_York') {
              if (offset === -240) return 'EDT';
              if (offset === -300) return 'EST';
            }
            if (timeZone === 'Europe/London') {
              if (offset === 60) return 'BST';
              if (offset === 0) return 'GMT';
            }
            const sign = offset >= 0 ? '+' : '-';
            const absolute = Math.abs(offset);
            return `UTC${sign}${String(Math.floor(absolute / 60)).padStart(2, '0')}:${String(absolute % 60).padStart(2, '0')}`;
          }

          function zonedTimestamp(dateParts, minuteOfDay, timeZone) {
            const hour = Math.floor(minuteOfDay / 60);
            const minute = minuteOfDay % 60;
            const targetAsUtc = Date.UTC(
              dateParts.year,
              dateParts.month - 1,
              dateParts.day,
              hour,
              minute,
              0
            );
            let guess = targetAsUtc;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const observed = zonedParts(guess, timeZone);
              const observedAsUtc = Date.UTC(
                observed.year,
                observed.month - 1,
                observed.day,
                observed.hour,
                observed.minute,
                observed.second
              );
              const correction = targetAsUtc - observedAsUtc;
              guess += correction;
              if (Math.abs(correction) < 1000) break;
            }
            return guess;
          }

          function formatWita(timestamp) {
            return new Intl.DateTimeFormat('id-ID', {
              timeZone: DISPLAY_ZONE,
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            }).format(new Date(timestamp)).replace('.', ':');
          }

          function minuteInZone(timestamp, timeZone) {
            const parts = zonedParts(timestamp, timeZone);
            return parts.hour * 60 + parts.minute;
          }

          function inWindow(minute, start, end) {
            return start < end
              ? minute >= start && minute < end
              : minute >= start || minute < end;
          }

          function sessionDetail(definition, timestamp) {
            const sourceDate = zonedParts(timestamp, definition.timeZone);
            const start = zonedTimestamp(sourceDate, definition.startMinute, definition.timeZone);
            const end = zonedTimestamp(sourceDate, definition.endMinute, definition.timeZone);
            return {
              id: definition.id,
              label: definition.label,
              timeZone: definition.timeZone,
              season: sourceSeason(timestamp, definition.timeZone),
              active: inWindow(
                minuteInZone(timestamp, definition.timeZone),
                definition.startMinute,
                definition.endMinute
              ),
              sourceStartMinute: definition.startMinute,
              sourceEndMinute: definition.endMinute,
              start,
              end,
              witaStart: formatWita(start),
              witaEnd: formatWita(end)
            };
          }

          export function executionSessionState(value, mode = 'NONE') {
            const timestamp = timestampMs(value);
            if (!Number.isFinite(timestamp)) {
              return {
                mode,
                ready: false,
                allowed: mode === 'NONE',
                activeSession: 'UNKNOWN',
                london: null,
                newYork: null,
                source: 'DST_AWARE_SESSION_CLOCK_V1'
              };
            }
            const london = sessionDetail(SESSION_DEFINITIONS.LONDON, timestamp);
            const newYork = sessionDetail(SESSION_DEFINITIONS.NEW_YORK, timestamp);
            const allowed = mode === 'NONE'
              ? true
              : mode === 'NEW_YORK_ONLY'
                ? newYork.active
                : mode === 'LONDON_ONLY'
                  ? london.active
                  : london.active || newYork.active;
            const activeSession = newYork.active
              ? 'NEW_YORK'
              : london.active
                ? 'LONDON'
                : 'OFF_SESSION';
            return {
              mode,
              ready: true,
              allowed,
              activeSession,
              london,
              newYork,
              displayZone: DISPLAY_ZONE,
              source: 'DST_AWARE_SESSION_CLOCK_V1'
            };
          }

          export function executionSessionAllowed(value, mode = 'NONE') {
            return executionSessionState(value, mode).allowed;
          }

          export function executionSessionRequirement(mode = 'NONE', value = Date.now()) {
            if (mode === 'NONE') return 'Tidak menjadi hard gate';
            const state = executionSessionState(value, mode);
            if (!state.ready) return 'Jam sesi belum dapat dihitung';
            const london = `London ${state.london.witaStart}–${state.london.witaEnd} WITA (${state.london.season})`;
            const newYork = `New York ${state.newYork.witaStart}–${state.newYork.witaEnd} WITA (${state.newYork.season})`;
            if (mode === 'NEW_YORK_ONLY') return `${newYork} · DST otomatis`;
            if (mode === 'LONDON_ONLY') return `${london} · DST otomatis`;
            return `${london} / ${newYork} · DST otomatis`;
          }

          export const EXECUTION_SESSION_CONFIG = Object.freeze({
            displayZone: DISPLAY_ZONE,
            london: SESSION_DEFINITIONS.LONDON,
            newYork: SESSION_DEFINITIONS.NEW_YORK
          });
          EOF

          cat > app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js <<'EOF'
          import {
            cleanConceptCandles,
            conceptAtrAtClean,
            conceptNumber
          } from './concept-candles.js';

          export const MAPPING_EVIDENCE_CLASS = Object.freeze({
            RAW_OBSERVATION: 'RAW_OBSERVATION',
            VALIDATED_CONTEXT: 'VALIDATED_CONTEXT',
            VALIDATED_CLAIM: 'VALIDATED_CLAIM',
            EXECUTION_AUTHORITY: 'EXECUTION_AUTHORITY'
          });

          const VALIDATED_ZONE_STATUSES = new Set([
            'CONFIRMED_REACTION',
            'IFVG_CONFIRMED_REACTION',
            'BREAKER_CONFIRMED_REACTION'
          ]);

          const TERMINAL_ZONE_STATUSES = new Set([
            'MITIGATED',
            'ACCEPTED_BROKEN',
            'CONVERSION_RETEST_UNCONFIRMED',
            'INVALID'
          ]);

          function timestampMs(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return NaN;
            return number > 10_000_000_000 ? number : number * 1000;
          }

          function toSourceTimestamp(milliseconds, reference) {
            return Number(reference) > 10_000_000_000 ? milliseconds : milliseconds / 1000;
          }

          function utcMonthStart(value) {
            const milliseconds = timestampMs(value);
            if (!Number.isFinite(milliseconds)) return NaN;
            const date = new Date(milliseconds);
            return Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1);
          }

          function previousMonthStart(currentMonthStart) {
            const date = new Date(currentMonthStart);
            return Date.UTC(date.getUTCFullYear(), date.getUTCMonth() - 1, 1);
          }

          function interactionStatus(values, type, level, startMs, tolerance) {
            const rows = values
              .map((candle, index) => ({ candle, index, timeMs: timestampMs(candle.time) }))
              .filter(item => item.timeMs >= startMs);
            const hit = rows.find(({ candle }) => type === 'BSL'
              ? candle.high > level + tolerance
              : candle.low < level - tolerance);
            if (!hit) {
              return {
                active: true,
                status: 'DETECTED',
                confirmed: false,
                interactionIndex: -1,
                interactionTime: null,
                reclaimDepthAtr: 0
              };
            }
            const candle = hit.candle;
            const exactSweep = type === 'BSL'
              ? candle.close < level - tolerance
              : candle.close > level + tolerance;
            const closedThrough = type === 'BSL'
              ? candle.close > level + tolerance
              : candle.close < level - tolerance;
            const localAtr = Math.max(conceptAtrAtClean(values, hit.index), 0.0000001);
            const reclaimDepthAtr = type === 'BSL'
              ? (level - candle.close) / localAtr
              : (candle.close - level) / localAtr;
            return {
              active: false,
              status: exactSweep
                ? 'CONFIRMED_REACTION'
                : closedThrough
                  ? 'CLOSED_THROUGH'
                  : 'SWEPT_UNCONFIRMED',
              confirmed: exactSweep,
              interactionIndex: hit.index,
              interactionTime: candle.time,
              reclaimDepthAtr
            };
          }

          export function detectPreviousMonthLevels(candles, dailyCandles, {
            currentPrice = null
          } = {}) {
            const values = cleanConceptCandles(candles);
            const daily = cleanConceptCandles(dailyCandles);
            if (!values.length || !daily.length) return [];
            const reference = values.at(-1).time;
            const currentStart = utcMonthStart(reference);
            const priorStart = previousMonthStart(currentStart);
            const priorRows = daily.filter(candle => {
              const time = timestampMs(candle.time);
              return time >= priorStart && time < currentStart;
            });
            if (!priorRows.length) return [];
            const high = Math.max(...priorRows.map(candle => candle.high));
            const low = Math.min(...priorRows.map(candle => candle.low));
            const latestAtr = Math.max(conceptAtrAtClean(values, values.length - 1), 0.0000001);
            const tolerance = latestAtr * 0.03;
            const availableIndex = values.findIndex(candle => timestampMs(candle.time) >= currentStart);
            const price = conceptNumber(currentPrice, values.at(-1).close);
            const build = (label, type, level) => {
              const interaction = interactionStatus(values, type, level, currentStart, tolerance);
              return {
                id: `${label}:${priorStart}:${level.toFixed(5)}`,
                type,
                subtype: label,
                label,
                level,
                source: label,
                sourcePeriod: 'PREVIOUS_MONTH',
                sourceStart: toSourceTimestamp(priorStart, reference),
                sourceEnd: toSourceTimestamp(currentStart, reference),
                originIndex: -1,
                availableIndex: availableIndex >= 0 ? availableIndex : values.length,
                tolerance,
                localAtr: latestAtr,
                tier: 'EXTERNAL_KEY',
                distance: Math.abs(level - price),
                evidenceClass: MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT,
                directionalAuthority: false,
                executionAuthority: false,
                ...interaction
              };
            };
            return [
              build('PMH', 'BSL', high),
              build('PML', 'SSL', low)
            ];
          }

          export function previousMonthSnapshot(levels) {
            const byLabel = Object.fromEntries((levels || []).map(level => [level.label, level]));
            return {
              pmh: byLabel.PMH?.level || 0,
              pml: byLabel.PML?.level || 0,
              pmhStatus: byLabel.PMH?.status || 'WAIT',
              pmlStatus: byLabel.PML?.status || 'WAIT'
            };
          }

          function protectedValue(value, side) {
            if (Number.isFinite(Number(value))) return Number(value);
            const keys = side === 'HIGH'
              ? ['price', 'level', 'high', 'value']
              : ['price', 'level', 'low', 'value'];
            for (const key of keys) {
              const candidate = Number(value?.[key]);
              if (Number.isFinite(candidate)) return candidate;
            }
            return null;
          }

          export function buildStrongWeakStructure(structureSnapshot, liquidityHierarchy) {
            const bias = String(structureSnapshot?.bias || structureSnapshot?.trend || 'NEUTRAL').toUpperCase();
            const protectedHigh = protectedValue(structureSnapshot?.protectedHigh, 'HIGH');
            const protectedLow = protectedValue(structureSnapshot?.protectedLow, 'LOW');
            const weakHigh = liquidityHierarchy?.activeTargets?.find(item => item.type === 'BSL') || null;
            const weakLow = liquidityHierarchy?.activeTargets?.find(item => item.type === 'SSL') || null;
            const bullish = bias.includes('BULL');
            const bearish = bias.includes('BEAR');
            const output = {
              bias,
              strongHigh: bearish && Number.isFinite(protectedHigh)
                ? { label: 'STRONG HIGH', level: protectedHigh, role: 'PROTECTED_STRUCTURE' }
                : null,
              strongLow: bullish && Number.isFinite(protectedLow)
                ? { label: 'STRONG LOW', level: protectedLow, role: 'PROTECTED_STRUCTURE' }
                : null,
              weakHigh: bullish && weakHigh
                ? { label: 'WEAK HIGH', level: weakHigh.level, role: 'DRAW_ON_LIQUIDITY', source: weakHigh.label }
                : null,
              weakLow: bearish && weakLow
                ? { label: 'WEAK LOW', level: weakLow.level, role: 'DRAW_ON_LIQUIDITY', source: weakLow.label }
                : null,
              evidenceClass: MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT,
              directionalAuthority: false,
              executionAuthority: false
            };
            output.summary = bullish
              ? output.strongLow && output.weakHigh
                ? `Strong Low ${output.strongLow.level.toFixed(2)} harus bertahan; Weak High ${output.weakHigh.level.toFixed(2)} adalah liquidity context, bukan jaminan target.`
                : 'Struktur bullish belum memiliki pasangan Strong Low dan Weak High yang lengkap.'
              : bearish
                ? output.strongHigh && output.weakLow
                  ? `Strong High ${output.strongHigh.level.toFixed(2)} harus bertahan; Weak Low ${output.weakLow.level.toFixed(2)} adalah liquidity context, bukan jaminan target.`
                  : 'Struktur bearish belum memiliki pasangan Strong High dan Weak Low yang lengkap.'
                : 'Struktur netral: Strong/Weak High-Low tidak dipaksakan.';
            return output;
          }

          function zonedParts(value, timeZone) {
            const milliseconds = timestampMs(value);
            if (!Number.isFinite(milliseconds)) return null;
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23'
            }).formatToParts(new Date(milliseconds));
            const read = type => Number(parts.find(item => item.type === type)?.value || 0);
            return {
              year: read('year'), month: read('month'), day: read('day'),
              hour: read('hour'), minute: read('minute')
            };
          }

          function dateKey(parts) {
            return parts
              ? `${parts.year}-${String(parts.month).padStart(2, '0')}-${String(parts.day).padStart(2, '0')}`
              : '';
          }

          export function detectMidnightOpenContext(m5Candles, {
            currentPrice = null
          } = {}) {
            const values = cleanConceptCandles(m5Candles);
            if (!values.length) {
              return {
                status: 'NO_DATA',
                active: false,
                evidenceClass: MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION,
                executionAuthority: false,
                summary: 'Candle M5 Midnight Open belum tersedia.'
              };
            }
            const zone = 'America/New_York';
            const latestParts = zonedParts(values.at(-1).time, zone);
            const latestKey = dateKey(latestParts);
            const rows = values
              .map((candle, index) => ({ candle, index, parts: zonedParts(candle.time, zone) }))
              .filter(item => dateKey(item.parts) === latestKey);
            const openRow = rows.find(item => item.parts.hour === 0 && item.parts.minute === 0)
              || rows.find(item => item.parts.hour === 0);
            if (!openRow) {
              return {
                status: 'WAITING_FOR_MIDNIGHT_CANDLE',
                active: false,
                date: latestKey,
                evidenceClass: MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION,
                executionAuthority: false,
                summary: 'Menunggu candle M5 pertama pada 00:00 New York.'
              };
            }
            const open = openRow.candle.open;
            const atr = Math.max(conceptAtrAtClean(values, openRow.index), 0.0000001);
            const tolerance = atr * 0.10;
            const after = rows.filter(item => item.index > openRow.index);
            const departure = after.find(({ candle }) =>
              candle.low > open + tolerance || candle.high < open - tolerance);
            const direction = departure
              ? departure.candle.low > open + tolerance ? 'ABOVE' : 'BELOW'
              : 'NONE';
            const afterDeparture = departure
              ? after.filter(item => item.index > departure.index)
              : [];
            const retest = afterDeparture.find(({ candle }) => direction === 'ABOVE'
              ? candle.low <= open + tolerance && candle.close > open
              : candle.high >= open - tolerance && candle.close < open);
            const testing = !retest && afterDeparture.find(({ candle }) =>
              candle.low <= open + tolerance && candle.high >= open - tolerance);
            const status = retest
              ? 'RETEST_CONFIRMED'
              : testing
                ? 'RETEST_TESTING'
                : departure
                  ? 'DEPARTED'
                  : 'WAITING_FOR_DEPARTURE';
            const price = conceptNumber(currentPrice, values.at(-1).close);
            return {
              date: latestKey,
              timeZone: zone,
              open,
              sourceTime: openRow.candle.time,
              sourceIndex: openRow.index,
              tolerance,
              departureDirection: direction,
              departureIndex: departure?.index ?? -1,
              retestIndex: retest?.index ?? -1,
              status,
              active: status !== 'NO_DATA',
              distance: Math.abs(price - open),
              evidenceClass: retest
                ? MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT
                : MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION,
              directionalAuthority: false,
              executionAuthority: false,
              summary: retest
                ? `Midnight Open ${open.toFixed(2)} sudah diretest dan ditolak kembali ${direction === 'ABOVE' ? 'ke atas' : 'ke bawah'}; tetap hanya konteks.`
                : departure
                  ? `Harga sudah berangkat ${direction === 'ABOVE' ? 'di atas' : 'di bawah'} Midnight Open ${open.toFixed(2)}; menunggu retest terkonfirmasi.`
                  : `Midnight Open ${open.toFixed(2)} tersedia; belum ada departure yang bersih.`
            };
          }

          const ADAPTIVE_EQUAL_PROFILES = Object.freeze({
            M1: Object.freeze({ toleranceAtr: 0.025, strength: 4 }),
            M5: Object.freeze({ toleranceAtr: 0.030, strength: 4 }),
            M15: Object.freeze({ toleranceAtr: 0.040, strength: 4 }),
            M30: Object.freeze({ toleranceAtr: 0.040, strength: 4 }),
            H1: Object.freeze({ toleranceAtr: 0.050, strength: 3 }),
            H4: Object.freeze({ toleranceAtr: 0.060, strength: 3 }),
            D1: Object.freeze({ toleranceAtr: 0.080, strength: 2 }),
            W1: Object.freeze({ toleranceAtr: 0.100, strength: 2 })
          });

          function confirmedPivots(values, strength) {
            const highs = [];
            const lows = [];
            for (let index = strength; index < values.length - strength; index += 1) {
              const high = values[index].high;
              const low = values[index].low;
              let pivotHigh = true;
              let pivotLow = true;
              for (let offset = 1; offset <= strength; offset += 1) {
                pivotHigh = pivotHigh
                  && high > values[index - offset].high
                  && high > values[index + offset].high;
                pivotLow = pivotLow
                  && low < values[index - offset].low
                  && low < values[index + offset].low;
              }
              if (pivotHigh) highs.push({ index, time: values[index].time, price: high });
              if (pivotLow) lows.push({ index, time: values[index].time, price: low });
            }
            return { highs, lows };
          }

          function clusterPivots(items, tolerance, type) {
            const clusters = [];
            for (const item of items.slice(-120)) {
              let cluster = clusters.find(candidate => Math.abs(candidate.level - item.price) <= tolerance);
              if (!cluster) {
                cluster = { type, level: item.price, touches: 0, pivots: [] };
                clusters.push(cluster);
              }
              cluster.pivots.push(item);
              cluster.touches += 1;
              cluster.level = cluster.pivots.reduce((sum, pivot) => sum + pivot.price, 0) / cluster.pivots.length;
            }
            return clusters
              .filter(cluster => cluster.touches >= 2)
              .sort((a, b) => b.pivots.at(-1).index - a.pivots.at(-1).index)
              .slice(0, 8)
              .map(cluster => ({
                ...cluster,
                firstIndex: cluster.pivots[0].index,
                lastIndex: cluster.pivots.at(-1).index,
                availableIndex: cluster.pivots.at(-1).index
              }));
          }

          export function detectAdaptiveEqualHighLow(candles, tf = 'M15') {
            const values = cleanConceptCandles(candles);
            const timeframe = String(tf || 'M15').toUpperCase();
            const profile = ADAPTIVE_EQUAL_PROFILES[timeframe] || ADAPTIVE_EQUAL_PROFILES.M15;
            if (!values.length) {
              return {
                timeframe,
                profile,
                appliedToProduction: false,
                authority: 'EXPERIMENTAL_ADVISORY',
                eqh: [],
                eql: []
              };
            }
            const atr = Math.max(conceptAtrAtClean(values, values.length - 1), 0.0000001);
            const tolerance = atr * profile.toleranceAtr;
            const pivots = confirmedPivots(values, profile.strength);
            return {
              timeframe,
              profile,
              atr,
              tolerance,
              productionToleranceAtr: 0.03,
              appliedToProduction: false,
              directionalAuthority: false,
              executionAuthority: false,
              authority: 'EXPERIMENTAL_ADVISORY',
              eqh: clusterPivots(pivots.highs, tolerance, 'EQH'),
              eql: clusterPivots(pivots.lows, tolerance, 'EQL'),
              note: 'Kandidat adaptif tidak mengganti cluster liquidity produksi sebelum validasi out-of-sample.'
            };
          }

          function originCandidate(candle, index, direction, breakIndex) {
            const opposite = direction === 'BULLISH'
              ? candle.close < candle.open
              : candle.close > candle.open;
            if (!opposite) return null;
            const body = Math.abs(candle.close - candle.open);
            const range = Math.max(candle.high - candle.low, 0.0000001);
            return {
              index,
              time: candle.time,
              open: candle.open,
              high: candle.high,
              low: candle.low,
              close: candle.close,
              bodyRatio: body / range,
              distanceBars: breakIndex - index,
              bottom: direction === 'BULLISH' ? candle.low : candle.open,
              top: direction === 'BULLISH' ? candle.open : candle.high
            };
          }

          export function reviewOrderBlockOrigins(orderBlocks, candles) {
            const values = cleanConceptCandles(candles);
            return (orderBlocks || []).map(zone => {
              const breakIndex = Number(zone.structureBreakIndex);
              const primaryIndex = Number(zone.originIndex);
              if (!Number.isInteger(breakIndex) || breakIndex <= 0) {
                return {
                  zoneId: zone.id,
                  applied: false,
                  authority: 'EXPERIMENTAL_ADVISORY',
                  lockedPrimaryIndex: primaryIndex,
                  alternative: null
                };
              }
              const start = Math.max(0, breakIndex - (zone.structureScope === 'MAJOR' ? 20 : 12));
              const candidates = [];
              for (let index = start; index < breakIndex; index += 1) {
                const candidate = originCandidate(values[index], index, zone.direction, breakIndex);
                if (candidate) candidates.push(candidate);
              }
              const alternative = [...candidates].sort((a, b) => zone.direction === 'BULLISH'
                ? a.low - b.low || a.distanceBars - b.distanceBars
                : b.high - a.high || a.distanceBars - b.distanceBars)[0] || null;
              return {
                zoneId: zone.id,
                direction: zone.direction,
                applied: false,
                authority: 'EXPERIMENTAL_ADVISORY',
                selectionMode: 'LOCKED_PRIMARY_WITH_EXTREME_CAUSAL_REVIEW',
                lockedPrimaryIndex: primaryIndex,
                alternative: alternative && alternative.index !== primaryIndex ? alternative : null,
                candidates,
                note: 'Alternatif tidak mengubah batas OB produksi sampai lulus validasi.'
              };
            });
          }

          function evidenceForZone(zone) {
            const status = String(zone?.status || 'DETECTED').toUpperCase();
            return VALIDATED_ZONE_STATUSES.has(status)
              ? MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT
              : MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION;
          }

          function freshnessForZone(zone) {
            const status = String(zone?.status || 'DETECTED').toUpperCase();
            const touchIndex = Number(zone?.touchIndex);
            const visibleIndex = Number(zone?.displayAvailableIndex ?? zone?.availableIndex);
            const staleAtBirth = Number.isInteger(touchIndex)
              && touchIndex >= 0
              && Number.isInteger(visibleIndex)
              && touchIndex <= visibleIndex;
            const fresh = status === 'DETECTED'
              && !staleAtBirth
              && !(Number.isInteger(touchIndex) && touchIndex >= 0)
              && !(Number.isInteger(Number(zone?.fullMitigationIndex)) && Number(zone.fullMitigationIndex) >= 0);
            return {
              zoneId: zone?.id,
              status,
              staleAtBirth,
              freshAtSnapshot: fresh,
              allowFreshLabel: fresh,
              displayState: fresh
                ? 'FRESH'
                : TERMINAL_ZONE_STATUSES.has(status)
                  ? 'TERMINAL_OR_USED'
                  : VALIDATED_ZONE_STATUSES.has(status)
                    ? 'VALIDATED_REACTION'
                    : 'TOUCHED_OR_TESTING'
            };
          }

          export function buildEvidenceCatalog({
            structureSnapshot,
            liquidityLevels,
            fairValueGaps,
            orderBlocks
          }) {
            const structures = (structureSnapshot?.events || []).map(event => ({
              id: event.id,
              kind: event.concept || event.kind,
              status: event.status,
              evidenceClass: event.valid && event.status === 'CONFIRMED_BREAK'
                ? MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT
                : MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION,
              directionalAuthority: false,
              executionAuthority: false
            }));
            const liquidity = (liquidityLevels || []).map(level => ({
              id: level.id,
              kind: level.subtype || level.type,
              status: level.status,
              evidenceClass: level.confirmed && level.status === 'CONFIRMED_REACTION'
                ? MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT
                : MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION,
              directionalAuthority: false,
              executionAuthority: false
            }));
            const zones = [...(fairValueGaps || []), ...(orderBlocks || [])].map(zone => ({
              id: zone.id,
              kind: zone.kind,
              status: zone.status,
              evidenceClass: evidenceForZone(zone),
              directionalAuthority: false,
              executionAuthority: false
            }));
            return { structures, liquidity, zones };
          }

          export function buildMappingContextEnhancements({
            tf = 'M15',
            candles = [],
            dailyCandles = [],
            m5Candles = [],
            currentPrice = null,
            structureSnapshot = {},
            liquidityLevels = [],
            liquidityHierarchy = {},
            fairValueGaps = [],
            orderBlocks = []
          } = {}) {
            const values = cleanConceptCandles(candles);
            const monthlyLevels = detectPreviousMonthLevels(values, dailyCandles, { currentPrice });
            const monthlySnapshot = previousMonthSnapshot(monthlyLevels);
            const strongWeak = buildStrongWeakStructure(structureSnapshot, liquidityHierarchy);
            const midnightSource = cleanConceptCandles(m5Candles).length
              ? m5Candles
              : String(tf).toUpperCase() === 'M5'
                ? values
                : [];
            const midnightOpen = detectMidnightOpenContext(midnightSource, { currentPrice });
            const adaptiveEqualHighLow = detectAdaptiveEqualHighLow(values, tf);
            const orderBlockOriginReview = reviewOrderBlockOrigins(orderBlocks, values);
            const zoneFreshnessAudit = [...fairValueGaps, ...orderBlocks].map(freshnessForZone);
            const evidenceCatalog = buildEvidenceCatalog({
              structureSnapshot,
              liquidityLevels,
              fairValueGaps,
              orderBlocks
            });
            const monthlyText = monthlySnapshot.pmh > 0
              ? `PMH ${monthlySnapshot.pmh.toFixed(2)} (${monthlySnapshot.pmhStatus}) · PML ${monthlySnapshot.pml.toFixed(2)} (${monthlySnapshot.pmlStatus}) · context only`
              : 'Data previous month belum tersedia.';
            const adaptiveCount = adaptiveEqualHighLow.eqh.length + adaptiveEqualHighLow.eql.length;
            return {
              version: '1.0.0',
              source: 'AMY_MAPPING_CONTEXT_ENHANCEMENTS_V1',
              evidenceContract: {
                classes: MAPPING_EVIDENCE_CLASS,
                rule: 'RAW dan VALIDATED CONTEXT tidak boleh membuka entry. EXECUTION AUTHORITY tetap hanya setupExecution resmi.',
                executionAuthoritySource: 'SETUP_EXECUTION_ONLY',
                directionForecastChanged: false,
                entryFormulaChanged: false,
                slTpFormulaChanged: false
              },
              evidenceCatalog,
              monthlyLevels,
              monthlySnapshot,
              strongWeak,
              midnightOpen,
              adaptiveEqualHighLow,
              orderBlockOriginReview,
              zoneFreshnessAudit,
              conceptRows: [
                ['Previous Month Liquidity', monthlySnapshot.pmhStatus, monthlyText],
                ['Strong / Weak Structure', strongWeak.bias, strongWeak.summary],
                ['Midnight Open', midnightOpen.status, midnightOpen.summary],
                ['Adaptive EQH / EQL', 'ADVISORY ONLY', `${adaptiveCount} kandidat adaptif · belum dipakai oleh Entry Map`],
                ['Evidence Contract', 'ENFORCED', 'RAW → VALIDATED CONTEXT → VALIDATED CLAIM; otoritas entry tetap setup resmi']
              ]
            };
          }
          EOF

      - name: Patch Concept Engine and DST-aware session gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('app/src/main/assets/apps/mapping/js/engine/concept-engine.js')
          engine = engine_path.read_text(encoding='utf-8')
          import_anchor = "import { detectPreviousPeriodLevels, previousPeriodSnapshot } from './concept-reference-levels.js';\n"
          import_line = "import { buildMappingContextEnhancements } from './concept-context-enhancements.js';\n"
          if import_line not in engine:
              if engine.count(import_anchor) != 1:
                  raise SystemExit('Concept Engine import anchor mismatch')
              engine = engine.replace(import_anchor, import_anchor + import_line, 1)

          enhancement_anchor = """  const latestConfirmedSweep = liquidityHierarchy.confirmedSweeps[0]
              || structureSnapshot.sweepEvents?.filter(event => event.valid).at(-1)
              || null;
          """
          enhancement_block = enhancement_anchor + """  const contextEnhancements = buildMappingContextEnhancements({
              tf,
              candles: values,
              dailyCandles: htfCandles?.D1 || [],
              m5Candles: htfCandles?.M5 || [],
              currentPrice: price,
              structureSnapshot,
              liquidityLevels,
              liquidityHierarchy,
              fairValueGaps,
              orderBlocks
            });
          """
          if 'const contextEnhancements = buildMappingContextEnhancements' not in engine:
              if engine.count(enhancement_anchor) != 1:
                  raise SystemExit('Concept Engine enhancement anchor mismatch')
              engine = engine.replace(enhancement_anchor, enhancement_block, 1)

          concept_anchor = """    ['Concept Filter', 'CONFIRMATION REQUIRED', `BOS/MSS valid memakai close swing 4/4 + buffer ${CONCEPT_THRESHOLDS.structurePenetrationAtr.toFixed(2)} ATR + displacement body ${CONCEPT_THRESHOLDS.displacementBodyAtr.toFixed(2)} ATR · reclaim sweep ≥ ${CONCEPT_THRESHOLDS.liquidityReclaimAtr.toFixed(2)} ATR`]
          """
          concept_replacement = """    ...contextEnhancements.conceptRows,
              ['Concept Filter', 'CONFIRMATION REQUIRED', `BOS/MSS valid memakai close swing 4/4 + buffer ${CONCEPT_THRESHOLDS.structurePenetrationAtr.toFixed(2)} ATR + displacement body ${CONCEPT_THRESHOLDS.displacementBodyAtr.toFixed(2)} ATR · reclaim sweep ≥ ${CONCEPT_THRESHOLDS.liquidityReclaimAtr.toFixed(2)} ATR`]
          """
          if '...contextEnhancements.conceptRows' not in engine:
              if engine.count(concept_anchor) != 1:
                  raise SystemExit('Concept row anchor mismatch')
              engine = engine.replace(concept_anchor, concept_replacement, 1)

          return_anchor = """    pwl: previousPeriods.pwl,
              liquidityHierarchy,
          """
          return_replacement = """    pwl: previousPeriods.pwl,
              pmh: contextEnhancements.monthlySnapshot.pmh,
              pml: contextEnhancements.monthlySnapshot.pml,
              contextEnhancements,
              evidenceContract: contextEnhancements.evidenceContract,
              evidenceCatalog: contextEnhancements.evidenceCatalog,
              strongWeakStructure: contextEnhancements.strongWeak,
              midnightOpen: contextEnhancements.midnightOpen,
              adaptiveEqualHighLow: contextEnhancements.adaptiveEqualHighLow,
              monthlyLevels: contextEnhancements.monthlyLevels,
              liquidityHierarchy,
          """
          if 'evidenceContract: contextEnhancements.evidenceContract' not in engine:
              if engine.count(return_anchor) != 1:
                  raise SystemExit('Concept Engine return anchor mismatch')
              engine = engine.replace(return_anchor, return_replacement, 1)

          zones_anchor = """      allFairValueGaps: fairValueGaps,
                allOrderBlocks: orderBlocks
          """
          zones_replacement = """      allFairValueGaps: fairValueGaps,
                allOrderBlocks: orderBlocks,
                freshnessAudit: contextEnhancements.zoneFreshnessAudit,
                orderBlockOriginReview: contextEnhancements.orderBlockOriginReview
          """
          if 'freshnessAudit: contextEnhancements.zoneFreshnessAudit' not in engine:
              if engine.count(zones_anchor) != 1:
                  raise SystemExit('Mapping zones anchor mismatch')
              engine = engine.replace(zones_anchor, zones_replacement, 1)
          engine_path.write_text(engine, encoding='utf-8')

          entry_path = Path('app/src/main/assets/apps/mapping/js/engine/concept-entry-map-v3.js')
          entry = entry_path.read_text(encoding='utf-8')
          entry_import_anchor = """import {
            entryProfileFor,
            normalizeMappingTimeframe,
            timeframeDurationMs
          } from './mapping-timeframes.js';
          """
          session_import = """import {
            executionSessionAllowed,
            executionSessionRequirement
          } from './market-session-clock.js';
          """
          if session_import not in entry:
              if entry.count(entry_import_anchor) != 1:
                  raise SystemExit('Entry Map import anchor mismatch')
              entry = entry.replace(entry_import_anchor, entry_import_anchor + session_import, 1)

          old_session = """function witaMinute(value) {
            const ms = timestampMs(value);
            if (!ms) return -1;
            const local = new Date(ms + 8 * 60 * 60 * 1000);
            return local.getUTCHours() * 60 + local.getUTCMinutes();
          }

          function inSession(minute, start, end) {
            return start < end ? minute >= start && minute < end : minute >= start || minute < end;
          }

          function validExecutionSession(candle, mode = 'NONE') {
            if (mode === 'NONE') return true;
            const minute = witaMinute(candle?.time);
            const london = inSession(minute, 14 * 60, 18 * 60);
            const newYork = inSession(minute, 19 * 60 + 30, 4 * 60);
            return mode === 'NEW_YORK_ONLY' ? newYork : london || newYork;
          }
          """
          new_session = """function validExecutionSession(candle, mode = 'NONE') {
            return executionSessionAllowed(candle?.time, mode);
          }
          """
          if old_session in entry:
              entry = entry.replace(old_session, new_session, 1)
          elif new_session not in entry:
              raise SystemExit('Entry Map session block mismatch')

          old_requirement = """profile.sessionMode === 'NEW_YORK_ONLY'
                  ? 'New York 19:30–04:00 WITA'
                  : profile.sessionRequired
                    ? 'London 14:00–18:00 / New York 19:30–04:00 WITA'
                    : 'Tidak menjadi hard gate'"""
          new_requirement = """profile.sessionRequired
                  ? executionSessionRequirement(profile.sessionMode, triggerCandle?.time)
                  : 'Tidak menjadi hard gate'"""
          count = entry.count(old_requirement)
          if count:
              entry = entry.replace(old_requirement, new_requirement)
          elif entry.count('executionSessionRequirement(profile.sessionMode, triggerCandle?.time)') < 2:
              raise SystemExit('Entry Map requirement text mismatch')
          entry_path.write_text(entry, encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/market-session-clock.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            executionSessionAllowed,
            executionSessionRequirement,
            executionSessionState
          } from '../app/src/main/assets/apps/mapping/js/engine/market-session-clock.js';

          test('London gate follows BST and GMT while shifting WITA automatically', () => {
            const summer = Date.parse('2026-07-01T06:30:00Z');
            const winter = Date.parse('2026-01-15T07:30:00Z');
            assert.equal(executionSessionAllowed(summer, 'LONDON_OR_NEW_YORK'), true);
            assert.equal(executionSessionAllowed(winter, 'LONDON_OR_NEW_YORK'), true);
            const summerText = executionSessionRequirement('LONDON_ONLY', summer);
            const winterText = executionSessionRequirement('LONDON_ONLY', winter);
            assert.match(summerText, /14:00–18:00 WITA \(BST\)/);
            assert.match(winterText, /15:00–19:00 WITA \(GMT\)/);
          });

          test('New York gate follows EDT and EST while shifting WITA automatically', () => {
            const summer = Date.parse('2026-08-05T11:30:00Z');
            const winter = Date.parse('2026-01-15T12:30:00Z');
            assert.equal(executionSessionAllowed(summer, 'NEW_YORK_ONLY'), true);
            assert.equal(executionSessionAllowed(winter, 'NEW_YORK_ONLY'), true);
            const summerState = executionSessionState(summer, 'NEW_YORK_ONLY');
            const winterState = executionSessionState(winter, 'NEW_YORK_ONLY');
            assert.equal(summerState.newYork.season, 'EDT');
            assert.equal(winterState.newYork.season, 'EST');
            assert.match(executionSessionRequirement('NEW_YORK_ONLY', summer), /19:30–04:00 WITA \(EDT\)/);
            assert.match(executionSessionRequirement('NEW_YORK_ONLY', winter), /20:30–05:00 WITA \(EST\)/);
          });

          test('off-session timestamp remains rejected and NONE remains allowed', () => {
            const timestamp = Date.parse('2026-08-05T05:00:00Z');
            assert.equal(executionSessionAllowed(timestamp, 'NEW_YORK_ONLY'), false);
            assert.equal(executionSessionAllowed(timestamp, 'LONDON_OR_NEW_YORK'), false);
            assert.equal(executionSessionAllowed(timestamp, 'NONE'), true);
          });
          EOF

          cat > tests/mapping-context-enhancements.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            MAPPING_EVIDENCE_CLASS,
            buildEvidenceCatalog,
            buildStrongWeakStructure,
            detectAdaptiveEqualHighLow,
            detectPreviousMonthLevels,
            previousMonthSnapshot,
            reviewOrderBlockOrigins
          } from '../app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js';

          const candle = (time, open, high, low, close) => ({
            time: Math.floor(Date.parse(time) / 1000),
            open, high, low, close,
            isClosed: true
          });

          test('PMH and PML are context-only previous-month liquidity', () => {
            const daily = [
              candle('2026-07-01T00:00:00Z', 3300, 3310, 3290, 3305),
              candle('2026-07-15T00:00:00Z', 3305, 3350, 3280, 3340),
              candle('2026-07-31T00:00:00Z', 3340, 3345, 3270, 3295),
              candle('2026-08-01T00:00:00Z', 3295, 3320, 3290, 3310)
            ];
            const intraday = Array.from({ length: 20 }, (_, index) =>
              candle(`2026-08-01T${String(index).padStart(2, '0')}:00:00Z`, 3300, 3310, 3290, 3300));
            const levels = detectPreviousMonthLevels(intraday, daily, { currentPrice: 3300 });
            const snapshot = previousMonthSnapshot(levels);
            assert.equal(snapshot.pmh, 3350);
            assert.equal(snapshot.pml, 3270);
            assert.equal(levels.every(level => level.executionAuthority === false), true);
            assert.equal(levels.every(level => level.evidenceClass === MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT), true);
          });

          test('strong and weak labels use protected structure and active liquidity without becoming entry authority', () => {
            const result = buildStrongWeakStructure(
              { bias: 'BULLISH', protectedLow: 3285, protectedHigh: 3360 },
              { activeTargets: [{ type: 'BSL', level: 3360, label: 'PMH' }] }
            );
            assert.equal(result.strongLow.level, 3285);
            assert.equal(result.weakHigh.level, 3360);
            assert.equal(result.executionAuthority, false);
          });

          test('adaptive EQH/EQL remains advisory and does not replace production threshold', () => {
            const values = [];
            let price = 3300;
            for (let index = 0; index < 80; index += 1) {
              const wave = Math.sin(index / 3) * 5;
              const high = price + wave + 3;
              const low = price + wave - 3;
              values.push({ time: 1_700_000_000 + index * 900, open: price + wave, high, low, close: price + wave + 0.5, isClosed: true });
            }
            const result = detectAdaptiveEqualHighLow(values, 'H1');
            assert.equal(result.appliedToProduction, false);
            assert.equal(result.productionToleranceAtr, 0.03);
            assert.equal(result.profile.toleranceAtr, 0.05);
          });

          test('dual-origin review never mutates the locked primary OB', () => {
            const values = [
              { time: 1, open: 100, high: 102, low: 97, close: 98, isClosed: true },
              { time: 2, open: 99, high: 101, low: 95, close: 96, isClosed: true },
              { time: 3, open: 96, high: 100, low: 94, close: 99, isClosed: true },
              { time: 4, open: 99, high: 108, low: 98, close: 107, isClosed: true }
            ];
            const zones = [{
              id: 'OB:BULLISH', direction: 'BULLISH', originIndex: 2,
              structureBreakIndex: 3, structureScope: 'INTERNAL'
            }];
            const review = reviewOrderBlockOrigins(zones, values)[0];
            assert.equal(review.lockedPrimaryIndex, 2);
            assert.equal(review.applied, false);
            assert.equal(zones[0].originIndex, 2);
          });

          test('evidence contract keeps raw zones outside execution authority', () => {
            const catalog = buildEvidenceCatalog({
              structureSnapshot: { events: [{ id: 's1', concept: 'MSS', status: 'CANDIDATE', valid: false }] },
              liquidityLevels: [{ id: 'l1', type: 'BSL', status: 'DETECTED', confirmed: false }],
              fairValueGaps: [{ id: 'f1', kind: 'FVG', status: 'DETECTED' }],
              orderBlocks: [{ id: 'o1', kind: 'ORDER_BLOCK', status: 'CONFIRMED_REACTION' }]
            });
            assert.equal(catalog.zones[0].evidenceClass, MAPPING_EVIDENCE_CLASS.RAW_OBSERVATION);
            assert.equal(catalog.zones[1].evidenceClass, MAPPING_EVIDENCE_CLASS.VALIDATED_CONTEXT);
            assert.equal(catalog.zones.every(item => item.executionAuthority === false), true);
          });
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate JavaScript and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/mapping/js/engine/market-session-clock.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-engine.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-entry-map-v3.js
          node --test tests/market-session-clock.test.mjs
          node --test tests/mapping-context-enhancements.test.mjs
          npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android unit test, lint, and debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Commit isolated Preview implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-mapping-context-enhancements.yml
          git add \
            app/src/main/assets/apps/mapping/js/engine/market-session-clock.js \
            app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js \
            app/src/main/assets/apps/mapping/js/engine/concept-engine.js \
            app/src/main/assets/apps/mapping/js/engine/concept-entry-map-v3.js \
            tests/market-session-clock.test.mjs \
            tests/mapping-context-enhancements.test.mjs
          git commit -m "feat(preview): add validated mapping context enhancements"
          git push origin HEAD:personal/amyfx-private
