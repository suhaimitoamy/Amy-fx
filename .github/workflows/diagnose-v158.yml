name: Diagnose Amy FX 1.5.8

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Changed regression files
        run: |
          node --test tests/journal-ai-rotation-v158.test.mjs
          node --test tests/profile-version-update-regression.test.mjs
          node --test tests/production-release-identity.test.mjs
          node --test tests/stage5-hardening.test.mjs
          node --test tests/five-issues-regression.test.mjs
      - name: Find first failing full regression file
        run: |
          set -euo pipefail
          for file in $(find tests -maxdepth 1 -name '*.test.mjs' | sort); do
            echo "Checking $file"
            if ! node --test --test-force-exit "$file" >/tmp/amyfx-test-output.txt 2>&1; then
              echo "FAILED_FILE=$file"
              cat /tmp/amyfx-test-output.txt
              exit 1
            fi
          done
