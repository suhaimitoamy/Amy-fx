name: Persist remaining journal storage fix

on:
  push:
    branches:
      - fix/journal-metadata-quota-20260725
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  persist:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-metadata-quota-20260725
          fetch-depth: 0
      - name: Apply remaining storage migration
        run: |
          python3 tools/fix_remaining_journal_storage_write.py
          rm -f tests/journal-syntax-diagnostic.txt
          rm -f tests/journal-regression-diagnostic.txt
          rm -f tests/journal-storage-write-locations.txt
      - name: Check syntax and focused regression
        run: |
          node --check app/src/main/assets/apps/journal/app.js
          node --test tests/journal-metadata-storage-regression.test.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Amy FX Fix Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/src/main/assets/apps/journal/app.js tests/journal-syntax-diagnostic.txt tests/journal-regression-diagnostic.txt tests/journal-storage-write-locations.txt
          git commit -m "fix(journal): finish IndexedDB metadata migration"
          git push origin HEAD:fix/journal-metadata-quota-20260725
