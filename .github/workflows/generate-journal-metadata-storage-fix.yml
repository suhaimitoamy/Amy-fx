name: Validate journal metadata storage fix

on:
  push:
    branches:
      - fix/journal-metadata-quota-20260725
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app syntax
        run: node --check app/src/main/assets/apps/journal/app.js
      - name: Run focused regression
        run: node --test tests/journal-metadata-storage-regression.test.mjs
      - name: Run full JavaScript regression
        run: timeout 10m npm test
      - name: Check repository diff
        run: git diff --check
