name: Capture journal metadata regression output

on:
  push:
    branches:
      - fix/journal-metadata-quota-20260725

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-metadata-quota-20260725
          fetch-depth: 0
      - name: Apply statistics correction
        run: |
          python3 tools/fix_journal_statistics_name.py
          rm -f tests/journal-syntax-diagnostic.txt
      - name: Capture focused regression
        run: |
          set +e
          node --test tests/journal-metadata-storage-regression.test.mjs > tests/journal-regression-diagnostic.txt 2>&1
          status=$?
          echo "exit_code=$status" >> tests/journal-regression-diagnostic.txt
          exit 0
      - name: Commit correction and diagnostic
        run: |
          git config user.name "Amy FX Fix Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/src/main/assets/apps/journal/app.js tests/journal-syntax-diagnostic.txt tests/journal-regression-diagnostic.txt
          git commit -m "test: capture journal metadata regression diagnostic"
          git push origin HEAD:fix/journal-metadata-quota-20260725
