name: Locate remaining journal metadata writes

on:
  push:
    branches:
      - fix/journal-metadata-quota-20260725

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-metadata-quota-20260725
          fetch-depth: 0
      - name: Locate legacy writes
        run: |
          grep -n -E 'localStorage\.setItem\((STORAGE_KEY|JOURNAL_STORAGE_KEY)' app/src/main/assets/apps/journal/app.js > tests/journal-storage-write-locations.txt || true
      - name: Commit concise diagnostic
        run: |
          git config user.name "Amy FX Fix Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/journal-storage-write-locations.txt
          git commit -m "test: locate remaining journal metadata writes"
          git push origin HEAD:fix/journal-metadata-quota-20260725
