name: Capture journal metadata syntax diagnostic

on:
  push:
    branches:
      - fix/journal-metadata-quota-20260725

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-metadata-quota-20260725
          fetch-depth: 0
      - name: Capture syntax output
        run: |
          set +e
          node --check app/src/main/assets/apps/journal/app.js > tests/journal-syntax-diagnostic.txt 2>&1
          status=$?
          echo "exit_code=$status" >> tests/journal-syntax-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "Amy FX Fix Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/journal-syntax-diagnostic.txt
          git commit -m "test: capture journal syntax diagnostic"
          git push origin HEAD:fix/journal-metadata-quota-20260725
