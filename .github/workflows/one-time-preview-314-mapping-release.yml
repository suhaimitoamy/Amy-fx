name: Stage Preview 314 Mapping Release

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-preview-314-mapping-release.yml

permissions:
  contents: write

jobs:
  bump-preview-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Preview branch only
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Bump Preview identity atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          gradle_text = gradle.read_text(encoding='utf-8')
          replacements = {
              '?: 940313)': '?: 940314)',
              '?: "2.0.0-preview.313"': '?: "2.0.0-preview.314"',
          }
          for old, new in replacements.items():
              if gradle_text.count(old) != 1:
                  raise SystemExit(f'Gradle version anchor mismatch: {old}')
              gradle_text = gradle_text.replace(old, new, 1)
          gradle.write_text(gradle_text, encoding='utf-8')

          version = Path('app/src/main/assets/app-version.js')
          version_text = version.read_text(encoding='utf-8')
          old_comment = '// Amy FX Preview rollback build — application tree restored to immutable Preview 310.'
          new_comment = '// Amy FX Preview mapping context enhancements build — execution authority remains setup-only.'
          if version_text.count(old_comment) != 1:
              raise SystemExit('App version comment anchor mismatch')
          version_text = version_text.replace(old_comment, new_comment, 1)
          old_identity = "const VERSION = Object.freeze({ name: '2.0.0-preview.313', code: 940313 });"
          new_identity = "const VERSION = Object.freeze({ name: '2.0.0-preview.314', code: 940314 });"
          if version_text.count(old_identity) != 1:
              raise SystemExit('App version identity anchor mismatch')
          version_text = version_text.replace(old_identity, new_identity, 1)
          version.write_text(version_text, encoding='utf-8')
          PY
          git rm .github/workflows/one-time-preview-314-mapping-release.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify identity and regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          grep -Fq '?: 940314)' app/build.gradle.kts
          grep -Fq '?: "2.0.0-preview.314"' app/build.gradle.kts
          grep -Fq "name: '2.0.0-preview.314', code: 940314" app/src/main/assets/app-version.js
          npm test

      - name: Commit Preview 314 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/assets/app-version.js
          git diff --cached --check
          git commit -m "chore(preview): release mapping enhancements as 2.0.0-preview.314"
          git push origin HEAD:personal/amyfx-private
