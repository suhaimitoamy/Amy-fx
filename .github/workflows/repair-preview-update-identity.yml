name: Repair Preview Update Identity

on:
  pull_request:
    branches:
      - personal/amyfx-private
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-preview-update-identity-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  repair-preview-identity:
    if: ${{ github.event.pull_request.head.ref == 'fix/preview-market-pipeline-live-price-20260730-definitive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align Preview updater fallback with Preview 293
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/update-checker.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('2.0.0-preview.292', '2.0.0-preview.293').replace('940292', '940293')
          required = [
              "name: '2.0.0-preview.293', code: 940293",
              'Number(VERSION.code) || 940293',
              "String(VERSION.name || '2.0.0-preview.293')",
              'personal/amyfx-private/preview-update.json',
          ]
          app_version = Path('app/src/main/assets/app-version.js').read_text(encoding='utf-8')
          combined = app_version + '\n' + text
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit('Missing Preview identity markers: ' + ', '.join(missing))
          path.write_text(text, encoding='utf-8')
          PY
          node --check app/src/main/assets/update-checker.js
      - name: Commit Preview updater identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/update-checker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(private): align Preview 293 updater identity [preview-identity-repaired]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
