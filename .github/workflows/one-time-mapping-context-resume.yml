name: Resume Mapping Context Enhancements

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-mapping-context-resume.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Preview branch only
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"

      - name: Extract approved patch scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-mapping-context-enhancements.yml')
          if not source.exists():
              raise SystemExit('Original isolated patch workflow is missing')

          targets = {
              'Write context enhancement modules': '/tmp/write-context.sh',
              'Patch Concept Engine and DST-aware session gate': '/tmp/patch-context.sh',
              'Add regression tests': '/tmp/add-context-tests.sh',
          }
          lines = source.read_text(encoding='utf-8').splitlines()
          current = None
          collecting = False
          output = []
          found = set()

          def flush():
              global output, collecting, current
              if current in targets and output:
                  Path(targets[current]).write_text('\n'.join(output) + '\n', encoding='utf-8')
                  found.add(current)
              output = []
              collecting = False

          for line in lines:
              if line.startswith('      - name: '):
                  flush()
                  current = line[len('      - name: '):]
                  continue
              if current in targets and line == '        run: |':
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('          ') or line == '':
                      output.append(line[10:] if line.startswith('          ') else '')
                  else:
                      flush()
          flush()

          missing = set(targets) - found
          if missing:
              raise SystemExit(f'Failed to extract patch steps: {sorted(missing)}')
          PY
          chmod +x /tmp/write-context.sh /tmp/patch-context.sh /tmp/add-context-tests.sh

      - name: Apply identical source patch
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/write-context.sh
          bash /tmp/patch-context.sh
          bash /tmp/add-context-tests.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js')
          text = path.read_text(encoding='utf-8')
          old = "function originCandidate(candle, index, direction, breakIndex) {\n  const opposite = direction === 'BULLISH'"
          new = "function originCandidate(candle, index, direction, breakIndex) {\n  if (!candle) return null;\n  const opposite = direction === 'BULLISH'"
          if old not in text and new not in text:
              raise SystemExit('OB origin guard anchor missing')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflows before integration audit
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/one-time-mapping-context-enhancements.yml \
            .github/workflows/one-time-mapping-context-resume.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript and all regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/mapping/js/engine/market-session-clock.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-engine.js
          node --check app/src/main/assets/apps/mapping/js/engine/concept-entry-map-v3.js
          node --test tests/market-session-clock.test.mjs
          node --test tests/mapping-context-enhancements.test.mjs
          npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android unit test, lint, and debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Commit validated Preview implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/assets/apps/mapping/js/engine/market-session-clock.js \
            app/src/main/assets/apps/mapping/js/engine/concept-context-enhancements.js \
            app/src/main/assets/apps/mapping/js/engine/concept-engine.js \
            app/src/main/assets/apps/mapping/js/engine/concept-entry-map-v3.js \
            tests/market-session-clock.test.mjs \
            tests/mapping-context-enhancements.test.mjs
          git diff --cached --check
          git commit -m "feat(preview): add validated mapping context enhancements"
          git push origin HEAD:personal/amyfx-private
