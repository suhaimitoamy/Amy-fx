name: Amy FX Preview Connectivity Audit

on:
  push:
    branches:
      - fix/preview-connectivity-audit-20260726-final8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amyfx-preview-connectivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AMYFX_APPLICATION_ID: com.amyelitesuite.learningpreview
      AMYFX_APP_LABEL: Amy FX Preview
      AMYFX_URI_SCHEME: amyfxpreview
      AMYFX_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/suhaimitoamy/Amy-fx/fix/preview-connectivity-audit-20260726-final8/preview-update.json
    steps:
      - name: Checkout connectivity branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Preview stabilization
        run: python3 tools/apply-blueprint-preview.py

      - name: Run all JavaScript and connectivity regressions
        run: npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android unit test, lint, and release compile
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon --no-configuration-cache
