name: Temporary Apply Mapping Bias and Scalper History Fix

on:
  push:
    branches:
      - fix/mapping-bias-scalper-history-20260804

permissions:
  contents: write

concurrency:
  group: temporary-apply-mapping-bias-scalper-history
  cancel-in-progress: true

jobs:
  apply-tested-fix:
    if: ${{ !contains(github.event.head_commit.message, '[apply-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/amyfx-fix.patch.gz.b64 <<'PATCH_B64'
[... ELLIPSIZATION ...]
PATCH_B64
          base64 --decode /tmp/amyfx-fix.patch.gz.b64 | gunzip > /tmp/amyfx-fix.patch
          git apply --check /tmp/amyfx-fix.patch
          git apply /tmp/amyfx-fix.patch

      - name: Validate JavaScript implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/mapping/js/engine/structural-bias.js
          node --check app/src/main/assets/apps/mapping/js/engine/core/analyze.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/scalper-shadow-state.js
          node --check app/src/main/assets/apps/mapping/js/scalper-entry-watch-v1.js
          node --test --test-force-exit tests/*.test.mjs

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(private): structural Mapping bias and permanent Scalper history [apply-fix]'
          git push origin HEAD:fix/mapping-bias-scalper-history-20260804
