name: Apply Market Pipeline Fix

on:
  push:
    branches:
      - fix/market-pipeline-live-price-20260730-definitive
      - fix/preview-market-pipeline-live-price-20260730-definitive

permissions:
  contents: write

concurrency:
  group: market-pipeline-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[market-pipeline-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore deterministic patcher
        shell: bash
        run: |
          mkdir -p tools
          printf '%s' '' | base64 -d | gzip -d > tools/apply-market-pipeline-fix.py
          python -m py_compile tools/apply-market-pipeline-fix.py
      - name: Apply fix
        run: python tools/apply-market-pipeline-fix.py
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/main/assets/apps/mapping/js/api/live-price-websocket.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/main.js
          node --check app/src/main/assets/apps/mapping/js/bridge/android-bridge.js
          node --check app/src/main/assets/apps/mapping/js/ui/ui-render.js
          node --check app/src/main/assets/apps/shared/amyfx-market-state-contract-v1.js
      - name: Run regression tests
        run: timeout 18m npm test
      - name: Commit generated fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: separate live WebSocket and deduplicate market candles [market-pipeline-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
