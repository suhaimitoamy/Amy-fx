name: Apply Single API Market Fix

on:
  push:
    branches:
      - fix/market-pipeline-single-api-20260730
      - fix/preview-market-pipeline-single-api-20260730

permissions:
  contents: write

concurrency:
  group: single-api-market-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[single-api-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one-provider market freshness repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          branch = os.environ.get('GITHUB_REF_NAME', '')
          preview = branch.startswith('fix/preview-')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing replacement marker for {label}: {old[:100]}')
              return text.replace(old, new)

          market_path = Path('app/src/main/assets/apps/mapping/js/api/market-data.js')
          market = read(market_path)
          if 'const LIVE_QUOTE_HARD_TTL_MS = 180_000;' not in market:
              marker = "const LIVE_POLL_MS = 20_000;\n"
              helper = r'''const LIVE_QUOTE_HARD_TTL_MS = 180_000;

function normalizedMarketTimestamp(value) {
  const numeric = Number(value);
  if (Number.isFinite(numeric) && numeric > 0) {
    return numeric > 100_000_000_000 ? numeric : numeric * 1000;
  }
  const text = String(value || '').trim();
  if (!text) return 0;
  const normalized = /Z$|[+-]\d{2}:?\d{2}$/.test(text)
    ? text
    : `${text.replace(' ', 'T')}Z`;
  const parsed = Date.parse(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function assertBackendPayloadFresh(data, label = 'Market') {
  const source = String(data?.source || '');
  const cacheState = String(data?.amyfxCacheState || '');
  if (/stale/i.test(source) || /stale/i.test(cacheState)) {
    throw new Error(`${label} memakai fallback data usang`);
  }
}

function validateLiveMarketPayload(data) {
  assertBackendPayloadFresh(data, 'Harga live');
  const capturedAt = normalizedMarketTimestamp(
    data?.quoteCapturedAt
    || data?.values?.[0]?.datetime
    || data?.latestOpenTime
  );
  const ageMs = capturedAt ? Date.now() - capturedAt : Number.POSITIVE_INFINITY;
  if (!capturedAt || ageMs > LIVE_QUOTE_HARD_TTL_MS || ageMs < -60_000) {
    throw new Error('Timestamp harga provider tidak lagi live');
  }
  return capturedAt;
}

'''
              market = replace_required(market, marker, marker + helper, 'market freshness helpers')

          fetch_marker = "  if (data.status === 'error') throw new Error(data.message || 'Fetch gagal');\n\n  const raw = (data.values || []).reverse();"
          fetch_replacement = "  if (data.status === 'error') throw new Error(data.message || 'Fetch gagal');\n  assertBackendPayloadFresh(data, `Candle ${tf}`);\n\n  const raw = (data.values || []).reverse();"
          if fetch_replacement not in market:
              market = replace_required(market, fetch_marker, fetch_replacement, 'closed-candle stale rejection')

          live_marker = "    const price = +(data.values?.[0]?.close || 0);\n    if (data.status !== 'ok' || !Number.isFinite(price) || price <= 0) throw new Error(data.message || 'Harga live tidak valid');\n    lastWsTickAt = Date.now();"
          live_replacement = "    const price = +(data.values?.[0]?.close || 0);\n    if (data.status !== 'ok' || !Number.isFinite(price) || price <= 0) throw new Error(data.message || 'Harga live tidak valid');\n    lastWsTickAt = validateLiveMarketPayload(data);"
          if live_replacement not in market:
              market = replace_required(market, live_marker, live_replacement, 'provider timestamp ownership')
          if 'new WebSocket' in market or 'twelve_api_key' in market:
              raise SystemExit('Single API repair must not add client WebSocket or client API-key storage')
          write(market_path, market)

          store_path = Path('lib/market-candle-store.mjs')
          store = read(store_path)
          if 'export function dedupeCandleRows' not in store:
              marker = "function rowToProviderValue(row) {\n"
              helper = r'''export function dedupeCandleRows(rows = []) {
  const unique = new Map();
  for (const row of rows) {
    const symbol = String(row?.symbol || '');
    const timeframe = String(row?.timeframe || '');
    const openTime = Number(row?.open_time || 0);
    if (!symbol || !timeframe || !openTime) continue;
    unique.set(`${symbol}|${timeframe}|${openTime}`, row);
  }
  return [...unique.values()].sort((a, b) => Number(b.open_time) - Number(a.open_time));
}

'''
              store = replace_required(store, marker, helper + marker, 'server candle dedupe helper')

          old_upsert = "async function upsertSupabaseCandles(rows) {\n  if (!directSupabaseConfigured() || !rows.length) return false;\n  const response = await fetchWithTimeout("
          new_upsert = "async function upsertSupabaseCandles(rows) {\n  const uniqueRows = dedupeCandleRows(rows);\n  if (!directSupabaseConfigured() || !uniqueRows.length) return false;\n  const response = await fetchWithTimeout("
          if new_upsert not in store:
              store = replace_required(store, old_upsert, new_upsert, 'dedupe before Supabase upsert')
          store = store.replace('body: JSON.stringify(rows)\n    },\n    SUPABASE_TIMEOUT_MS', 'body: JSON.stringify(uniqueRows)\n    },\n    SUPABASE_TIMEOUT_MS', 1)
          old_normalize = "    const normalizedProviderRows = data.values\n      .map(value => providerValueToRow(value, symbol, interval))\n      .filter(Boolean);"
          new_normalize = "    const normalizedProviderRows = dedupeCandleRows(data.values\n      .map(value => providerValueToRow(value, symbol, interval))\n      .filter(Boolean));"
          if new_normalize not in store:
              store = replace_required(store, old_normalize, new_normalize, 'dedupe normalized provider rows')
          write(store_path, store)

          scanner_path = Path('app/src/main/java/com/amyelitesuite/ScannerService.kt')
          scanner = read(scanner_path)
          if 'import java.time.Instant' not in scanner:
              scanner = replace_required(scanner, 'import java.util.Locale\n', 'import java.util.Locale\nimport java.time.Instant\n', 'Scanner Instant import')
          old_scanner = '''            val values = json.optJSONArray("values") ?: error("Market values missing")
            val latest = values.optJSONObject(0) ?: error("Latest market candle missing")
            val price = latest.optString("close").toDoubleOrNull()
                ?: latest.optDouble("close", Double.NaN)

            if (!price.isFinite() || price <= 0.0) error("Invalid market price")
            checkTargets(price)'''
          new_scanner = '''            val source = json.optString("source")
            val cacheState = json.optString("amyfxCacheState")
            if (source.contains("stale", ignoreCase = true) || cacheState.contains("stale", ignoreCase = true)) {
                error("Stale market fallback")
            }

            val values = json.optJSONArray("values") ?: error("Market values missing")
            val latest = values.optJSONObject(0) ?: error("Latest market candle missing")
            val price = latest.optString("close").toDoubleOrNull()
                ?: latest.optDouble("close", Double.NaN)
            val capturedAt = providerTimestampMillis(json.optString("quoteCapturedAt"), latest.optString("datetime"))
            val ageMs = if (capturedAt > 0L) System.currentTimeMillis() - capturedAt else Long.MAX_VALUE

            if (!price.isFinite() || price <= 0.0) error("Invalid market price")
            if (capturedAt <= 0L || ageMs > LIVE_QUOTE_HARD_TTL_MS || ageMs < -60_000L) error("Stale provider timestamp")
            checkTargets(price)'''
          if new_scanner not in scanner:
              scanner = replace_required(scanner, old_scanner, new_scanner, 'native stale quote rejection')
          if 'private fun providerTimestampMillis' not in scanner:
              marker = '    private fun loadTargets(intent: Intent?) {'
              helper = '''    private fun providerTimestampMillis(primary: String, fallback: String): Long {
        val raw = primary.ifBlank { fallback }.trim()
        if (raw.isBlank()) return 0L
        val normalized = if (raw.endsWith("Z") || Regex("[+-]\\d{2}:?\\d{2}$").containsMatchIn(raw)) {
            raw.replace(" ", "T")
        } else {
            raw.replace(" ", "T") + "Z"
        }
        return try { Instant.parse(normalized).toEpochMilli() } catch (_: Exception) { 0L }
    }

'''
              scanner = replace_required(scanner, marker, helper + marker, 'native timestamp parser')
          if 'private const val LIVE_QUOTE_HARD_TTL_MS' not in scanner:
              scanner = replace_required(scanner, '        private const val MARKET_POLL_MS = 30_000L\n', '        private const val MARKET_POLL_MS = 30_000L\n        private const val LIVE_QUOTE_HARD_TTL_MS = 180_000L\n', 'native live TTL')
          write(scanner_path, scanner)

          if preview:
              replacements = {
                  'app/build.gradle.kts': [('940292)', '940293)'), ('"2.0.0-preview.292"', '"2.0.0-preview.293"')],
                  'app/src/main/assets/app-version.js': [("2.0.0-preview.292", "2.0.0-preview.293"), ('940292', '940293')],
                  'app/src/main/assets/update-checker.js': [("2.0.0-preview.292", "2.0.0-preview.293"), ('940292', '940293')],
              }
              for path, pairs in replacements.items():
                  text = read(path)
                  for old, new in pairs:
                      text = replace_required(text, old, new, f'{path} Preview version')
                  write(path, text)
              for path in Path('.github/workflows').glob('*.yml'):
                  text = read(path)
                  if 'Amy FX Private Preview Release' in text:
                      text = text.replace('2.0.0-preview.292', '2.0.0-preview.293').replace('940292', '940293')
                      text = text.replace('- Mapping tidak lagi berkedip saat data diperbarui.', '- Harga live menolak fallback lama dan memakai timestamp asli backend provider.')
                      text = text.replace("'Mapping tidak lagi berkedip saat data diperbarui.'", "'Harga live menolak fallback lama dan memakai timestamp asli backend provider.'")
                      write(path, text)
              for path in Path('tests').glob('*.mjs'):
                  text = read(path)
                  if '2.0.0-preview.292' in text or '940292' in text:
                      write(path, text.replace('2.0.0-preview.292', '2.0.0-preview.293').replace('940292', '940293'))
          else:
              replacements = {
                  'app/build.gradle.kts': [('?: 52)', '?: 53)'), ('"2.0.1"', '"2.0.2"')],
                  'app/src/main/assets/app-version.js': [("name: '2.0.1', code: 52", "name: '2.0.2', code: 53")],
                  'app/src/main/assets/update-checker.js': [("name: '2.0.1', code: 52", "name: '2.0.2', code: 53"), ('Number(VERSION.code) || 52', 'Number(VERSION.code) || 53'), ("String(VERSION.name || '2.0.1')", "String(VERSION.name || '2.0.2')")],
              }
              for path, pairs in replacements.items():
                  text = read(path)
                  for old, new in pairs:
                      text = replace_required(text, old, new, f'{path} public version')
                  write(path, text)

              build_apk = read('.github/workflows/build-apk.yml')
              for old, new in [
                  ('AMYFX_VERSION_NAME: "2.0.1"', 'AMYFX_VERSION_NAME: "2.0.2"'),
                  ('AMYFX_VERSION_CODE: "52"', 'AMYFX_VERSION_CODE: "53"'),
                  ('Amy FX 2.0.1', 'Amy FX 2.0.2'),
                  ('latest_version_code=52', 'latest_version_code=53'),
                  ("latest_version_name='2.0.1'", "latest_version_name='2.0.2'"),
                  ('versionCode=52', 'versionCode=53'),
                  ("version='2.0.1'", "version='2.0.2'"),
                  ('"latest_version_code": 52', '"latest_version_code": 53'),
                  ('"latest_version_name": "2.0.1"', '"latest_version_name": "2.0.2"'),
              ]:
                  build_apk = build_apk.replace(old, new)
              build_apk = build_apk.replace("notes='Amy FX 2.0.2 memperbaiki kedipan dan perpindahan layar Mapping, mempertahankan panel Scalper Shadow secara permanen, menolak respons lifecycle lama, serta membersihkan header status. Amy FX Preview pribadi tetap terpisah.'", "notes='Amy FX 2.0.2 memperbaiki jalur harga XAU/USD: candle dideduplikasi sebelum disimpan, fallback usang ditolak, dan status LIVE mengikuti timestamp asli provider. Amy FX Preview pribadi tetap terpisah.'")
              write('.github/workflows/build-apk.yml', build_apk)

              stage5 = read('.github/workflows/stage5-apply.yml').replace('2.0.1', '2.0.2').replace('release/amyfx-public-2.0.1', 'release/amyfx-public-2.0.2').replace('AMYFX_VERSION_CODE: "52"', 'AMYFX_VERSION_CODE: "53"')
              write('.github/workflows/stage5-apply.yml', stage5)
              manual = read('.github/workflows/build-release.yml')
              manual = re.sub(r'default: "[^"]+"', 'default: "2.0.2"', manual, count=1)
              manual = re.sub(r'default: "\d+"', 'default: "53"', manual, count=1)
              write('.github/workflows/build-release.yml', manual)

              version_test = read('tests/production-release-identity.test.mjs')
              version_test = version_test.replace('2.0.1', '2.0.2').replace('?: 52', '?: 53').replace('code: 52', 'code: 53').replace('VERSION_CODE: "52"', 'VERSION_CODE: "53"').replace('latest_version_code=52', 'latest_version_code=53')
              write('tests/production-release-identity.test.mjs', version_test)

              stage5_test = '''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read=p=>readFileSync(new URL(`../${p}`,import.meta.url),'utf8');
          test('Amy FX public source uses permanent production identity',()=>{const g=read('app/build.gradle.kts'),v=read('app/src/main/assets/app-version.js');assert.match(g,/configuredApplicationId = System\\.getenv\\("AMYFX_APPLICATION_ID"\\) \\?: "com\\.amyelitesuite"/);assert.match(g,/configuredAppLabel = System\\.getenv\\("AMYFX_APP_LABEL"\\) \\?: "Amy FX"/);assert.match(g,/configuredUriScheme = System\\.getenv\\("AMYFX_URI_SCHEME"\\) \\?: "amyfx"/);assert.match(g,/versionCode[^\\n]*53/);assert.match(g,/versionName[^\\n]*"2\\.0\\.2"/);assert.match(v,/name: '2\\.0\\.2', code: 53/);assert.doesNotMatch(g,/learningpreview|Amy FX Preview|amyfxpreview|preview-update\\.json/);assert.doesNotMatch(v,/Preview|personal\\/amyfx-private/)});
          test('published metadata is never ahead of published APK',()=>{const m=JSON.parse(read('update.json'));const versions=new Map([[40,'1.4.17'],[41,'1.5.0'],[42,'1.5.1'],[43,'1.5.2'],[44,'1.5.3'],[45,'1.5.4'],[46,'1.5.5'],[47,'1.5.6'],[48,'1.5.7'],[49,'1.5.8'],[50,'1.5.9'],[51,'2.0.0'],[52,'2.0.1'],[53,'2.0.2']]);assert.equal(m.latest_version_name,versions.get(m.latest_version_code));assert.ok(m.latest_version_code<=53);assert.ok(m.release_notes.length>0)});
          test('client keeps TwelveData credentials on the backend only',()=>{const main=read('app/src/main/assets/apps/mapping/js/main.js'),bridge=read('app/src/main/assets/apps/mapping/js/bridge/android-bridge.js'),market=read('app/src/main/assets/apps/mapping/js/api/market-data.js');assert.doesNotMatch(main,/localStorage\\.getItem\\('twelve_api_key'\\)/);assert.doesNotMatch(bridge,/localStorage\\.setItem\\('twelve_api_key'/);assert.doesNotMatch(market,/new WebSocket|twelve_api_key/);assert.match(market,/PROXY_URL/)});
          test('release workflows pin certificate and inspect v1 plus v2',()=>{const g=read('app/build.gradle.kts');assert.match(g,/enableV1Signing = true/);assert.match(g,/enableV2Signing = true/);for(const p of ['.github/workflows/build-apk.yml','.github/workflows/build-release.yml','.github/workflows/stage5-apply.yml']){const w=read(p);assert.match(w,/META-INF\\/\\[\\^\\/\\]\\+\\\\\\.SF/);assert.match(w,/META-INF\\/\\[\\^\\/\\]\\+\\\\\\.\\(RSA\\|DSA\\|EC\\)/);assert.match(w,/0x7109871A/);assert.match(w,/keytool -printcert/);assert.match(w,/47:C2:32:BC:44:FA:63:C9:2F:FE:41:1F:71:40:40:4C:09:AA:2A:9C:BF:82:B1:85:9A:86:0B:85:56:7B:AD:C7/)}const rolling=read('.github/workflows/build-apk.yml');assert.match(rolling,/AMYFX_VERSION_NAME: "2\\.0\\.2"/);assert.match(rolling,/AMYFX_VERSION_CODE: "53"/);assert.match(rolling,/Verify public update manifest source/);const manual=read('.github/workflows/build-release.yml');assert.match(manual,/default: "2\\.0\\.2"/);assert.match(manual,/default: "53"/);const candidate=read('.github/workflows/stage5-apply.yml');assert.match(candidate,/Validate Amy FX 2\\.0\\.2/)});
          test('public Firebase client remains public',()=>{const f=JSON.parse(read('app/google-services.json'));assert.equal(f.client[0].client_info.android_client_info.package_name,'com.amyelitesuite');assert.equal('private_key' in f,false)});
          '''
              write('tests/stage5-hardening.test.mjs', stage5_test)
              readme = read('README.md').replace('`2.0.1`', '`2.0.2`').replace('**Version code:** `52`', '**Version code:** `53`')
              write('README.md', readme)

          test_path = Path('tests/market-single-api-freshness.test.mjs')
          test_path.write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { dedupeCandleRows } from '../lib/market-candle-store.mjs';
          const read = path => readFileSync(new URL(`../${path}`, import.meta.url), 'utf8');
          test('live quote stays on one backend API and uses provider freshness', () => {
            const source = read('app/src/main/assets/apps/mapping/js/api/market-data.js');
            assert.match(source, /const LIVE_POLL_MS = 20_000/);
            assert.match(source, /validateLiveMarketPayload\\(data\\)/);
            assert.match(source, /data\\?\\.quoteCapturedAt/);
            assert.match(source, /assertBackendPayloadFresh\\(data, `Candle \\${tf}`\\)/);
            assert.doesNotMatch(source, /lastWsTickAt = Date\\.now\\(\\)/);
            assert.doesNotMatch(source, /new WebSocket|twelve_api_key/);
          });
          test('duplicate candle keys collapse before Supabase upsert', () => {
            const rows = dedupeCandleRows([
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 10, close: 1 },
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 10, close: 2 },
              { symbol: 'XAU/USD', timeframe: 'M1', open_time: 11, close: 3 }
            ]);
            assert.equal(rows.length, 2);
            assert.equal(rows.find(row => row.open_time === 10).close, 2);
          });
          test('native scanner rejects stale backend responses', () => {
            const source = read('app/src/main/java/com/amyelitesuite/ScannerService.kt');
            assert.match(source, /amyfxCacheState/);
            assert.match(source, /Stale provider timestamp/);
            assert.match(source, /LIVE_QUOTE_HARD_TTL_MS = 180_000L/);
          });
          ''', encoding='utf-8')

          for helper in [
              '.github/workflows/apply-market-pipeline-fix.yml',
              '.github/workflows/repair-market-state-contract-test.yml',
              '.github/workflows/repair-preview-update-identity.yml',
              '.contract-test-repair-trigger',
          ]:
              Path(helper).unlink(missing_ok=True)
          PY
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --test tests/market-single-api-freshness.test.mjs
          timeout 20m npm test
      - name: Commit clean single-API repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reject stale market data on one backend API [single-api-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
