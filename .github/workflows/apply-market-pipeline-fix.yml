name: Apply Single API Market Fix

on:
  push:
    branches:
      - fix/preview-market-pipeline-single-api-20260730

permissions:
  contents: write

concurrency:
  group: single-api-market-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[single-api-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load canonical one-provider patch from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              ['git', 'show', 'origin/main:.github/workflows/apply-market-pipeline-fix.yml'],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('Canonical patch start marker not found')
          start += len(start_marker)
          end = workflow.find("\n          PY\n", start)
          if end < 0:
              raise SystemExit('Canonical patch end marker not found')
          Path('/tmp/apply-single-api-fix.py').write_text(
              textwrap.dedent(workflow[start:end]),
              encoding='utf-8',
          )
          PY
          python3 /tmp/apply-single-api-fix.py
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --test tests/market-single-api-freshness.test.mjs
          timeout 20m npm test
      - name: Commit clean Preview repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(private): reject stale market data on one backend API [single-api-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
