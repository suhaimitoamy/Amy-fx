name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version Name (e.g., 2.0.1)"
        required: true
        default: "2.0.1"
      versionCode:
        description: "Version Code (must increase)"
        required: true
        default: "52"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AMYFX_KEYSTORE_PATH: /tmp/amy-fx-signing.keystore
      AMYFX_KEYSTORE_PASSWORD: android
      AMYFX_KEY_ALIAS: androiddebugkey
      AMYFX_KEY_PASSWORD: android
      AMYFX_VERSION_NAME: ${{ github.event.inputs.versionName }}
      AMYFX_VERSION_CODE: ${{ github.event.inputs.versionCode }}
      AMYFX_SIGNING_CERT_SHA256: "47:C2:32:BC:44:FA:63:C9:2F:FE:41:1F:71:40:40:4C:09:AA:2A:9C:BF:82:B1:85:9A:86:0B:85:56:7B:AD:C7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: timeout 15m npm test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: amy-fx-debug-keystore-v1
      - name: Verify permanent signing key
        run: |
          set -euo pipefail
          test "${{ steps.signing-cache.outputs.cache-hit }}" = "true"
          cp "$HOME/.android/debug.keystore" "$AMYFX_KEYSTORE_PATH"
          actual="$(keytool -list -v -keystore "$AMYFX_KEYSTORE_PATH" -storepass "$AMYFX_KEYSTORE_PASSWORD" -alias "$AMYFX_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$actual" = "$AMYFX_SIGNING_CERT_SHA256"
      - run: chmod +x ./gradlew
      - run: ./gradlew testReleaseUnitTest --no-configuration-cache
      - run: ./gradlew lintRelease --no-configuration-cache
      - run: ./gradlew assembleRelease --no-configuration-cache --stacktrace
      - name: Verify APK identity, requested version, signing structures and signer
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.amyelitesuite' versionCode='${AMYFX_VERSION_CODE}' versionName='${AMYFX_VERSION_NAME}'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sf_entry="$(unzip -Z1 "$apk" | grep -E '^META-INF/[^/]+\.SF$' | head -n1)"
          cert_entry="$(unzip -Z1 "$apk" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' | head -n1)"
          test -n "$sf_entry"; test -n "$cert_entry"
          unzip -p "$apk" "$cert_entry" > /tmp/amyfx-apk-cert
          expected="$(echo "$AMYFX_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -printcert -file /tmp/amyfx-apk-cert | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          APK_PATH="$apk" python3 - <<'PY'
          import os, struct
          data=open(os.environ['APK_PATH'],'rb').read(); i=data.rfind(b'APK Sig Block 42')
          if i < 0: raise SystemExit('APK Signing Block tidak ditemukan')
          size=struct.unpack_from('<Q',data,i-8)[0]; start=i+8-size
          if start < 0 or struct.unpack_from('<Q',data,start)[0] != size: raise SystemExit('APK Signing Block tidak valid')
          pos,end,ids=start+8,i-8,set()
          while pos < end:
              length=struct.unpack_from('<Q',data,pos)[0]; pos+=8
              if length < 4 or pos+length > end: raise SystemExit('Pasangan APK Signing Block rusak')
              ids.add(struct.unpack_from('<I',data,pos)[0]); pos+=length
          if 0x7109871A not in ids: raise SystemExit('APK Signature Scheme v2 tidak ditemukan')
          PY
