name: Temporary Update Preview 307 Release Notes

on:
  pull_request:
    branches:
      - personal/amyfx-private

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mapping-bias-scalper-history-20260804
          fetch-depth: 0
      - name: Update Preview release notes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/amyfx-blueprint-preview-release.yml')
          text = path.read_text(encoding='utf-8')
          marker = "'release_notes': ["
          start = text.index(marker)
          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]
          end_marker = "\n          }\n          with open('preview-update.json'"
          end = text.index(end_marker, start)
          item = indent + '    '
          lines = [
              indent + "'release_notes': [",
              item + "'Bias Mapping tetap terpisah dari setup dan memakai bias Mapping yang sudah ada sebagai sumber utama.',",
              item + "'Jika bias Mapping belum tersedia, arah dibentuk dari HH/HL atau LH/LL beserta invalidasi candle close.',",
              item + "'Status setup boleh WAIT tanpa menghilangkan bias BUY atau SELL untuk entry manual.',",
              item + "'Riwayat Scalper Engine disimpan permanen dan tidak hilang saat notifikasi dibuka.',",
              item + "'Klik notifikasi membuka setup yang tepat berdasarkan setup ID.',",
              item + "'Driver, arah, entry, Stop Loss, TP1, TP2, dan lifecycle Scalper Engine tidak diubah.',",
              item + "'Amy FX publik pada branch main tidak diubah.'",
              indent + "],",
              indent + "'changelog': [",
              item + "'Independent Mapping structural bias with HH/HL/LH/LL fallback',",
              item + "'Close-based structural invalidation and last-valid-bias persistence',",
              item + "'Permanent Scalper setup history and exact notification deep links',",
              item + "'All-history Scalper API response without changing the engine',",
              item + "'Preview version 2.0.0-preview.307'",
              indent + "]",
          ]
          path.write_text(text[:line_start] + '\n'.join(lines) + text[end:], encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-update-preview-release-notes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(private): finalize Preview 307 release notes [skip ci]'
          git push origin HEAD:fix/mapping-bias-scalper-history-20260804
