name: Scalper Engine June 2025 Backtest

on:
  pull_request:
    branches:
      - personal/amyfx-private

permissions:
  contents: read

jobs:
  backtest:
    if: github.head_ref == 'backtest/scalper-june-2025'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated backtest branch
        uses: actions/checkout@v4

      - name: Verify current Scalper Engine tests
        run: node --test tests/scalper-bt6-pattern-engine.test.mjs tests/scalper-multidriver.test.mjs

      - name: Download audited source candles
        run: python tools/backtests/download_xauusd_june_2025.py

      - name: Replay Scalper Engine
        run: node tools/backtests/run_scalper_june_2025.mjs

      - name: Package results
        run: |
          mkdir -p backtest_bundle
          cp backtest_output/AMYFX_SCALPER_JUNE_2025_* backtest_bundle/
          cp backtest_output/data/DATA_AUDIT.json backtest_bundle/
          cp tools/backtests/run_scalper_june_2025.mjs backtest_bundle/REPLAY_RUNNER.mjs
          cp tools/backtests/download_xauusd_june_2025.py backtest_bundle/DATA_LOADER.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: amyfx-scalper-june-2025-backtest
          path: backtest_bundle
          if-no-files-found: error
          retention-days: 7
