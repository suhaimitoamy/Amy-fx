name: Align Preview 315 Updater Fallback

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-align-preview-315-updater.yml

permissions:
  contents: write

jobs:
  align-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify Preview branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"

      - name: Align updater fallback to pending Preview identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/update-checker.js')
          text = path.read_text(encoding='utf-8')
          old = """  const VERSION = window.AmyFXAppVersion || { name: '2.0.0-preview.313', code: 940313 };
            const CURRENT_VERSION_CODE = Number(VERSION.code) || 940313;
            const CURRENT_VERSION_NAME = String(VERSION.name || '2.0.0-preview.313');"""
          new = """  const VERSION = window.AmyFXAppVersion || { name: '2.0.0-preview.315', code: 940315 };
            const CURRENT_VERSION_CODE = Number(VERSION.code) || 940315;
            const CURRENT_VERSION_NAME = String(VERSION.name || '2.0.0-preview.315');"""
          if old not in text:
              raise SystemExit('Updater fallback .313 anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-align-preview-315-updater.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate updater and Blueprint identity
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/update-checker.js
          grep -Fq "name: '2.0.0-preview.315', code: 940315" app/src/main/assets/update-checker.js
          python3 tools/apply-blueprint-preview.py
          node --test --test-force-exit tests/blueprint-preview-v1.test.mjs tests/blueprint-preview-stabilization.test.mjs

      - name: Commit aligned updater fallback
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-time-align-preview-315-updater.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(preview): align updater fallback with 2.0.0-preview.315 [skip ci]"
          git push origin HEAD:personal/amyfx-private
