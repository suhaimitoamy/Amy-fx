name: Apply Market Pipeline Fix V5

on:
  push:
    branches:
      - fix/preview-market-pipeline-live-price-20260730-definitive

permissions:
  contents: write

concurrency:
  group: preview-market-pipeline-fix-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[market-pipeline-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore deterministic patcher from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/apply-market-pipeline-fix.yml?ref=main" --jq .content | base64 -d > /tmp/market-pipeline-workflow.yml
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text=Path('/tmp/market-pipeline-workflow.yml').read_text()
          match=re.search(r"printf '%s' '([^']+)'", text)
          if not match:
              raise SystemExit('Embedded market pipeline patcher not found')
          Path('tools').mkdir(exist_ok=True)
          Path('tools/apply-market-pipeline-fix.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python3 -m py_compile tools/apply-market-pipeline-fix.py
      - name: Apply preview runtime repair
        run: |
          rm -f .market-pipeline-trigger-v5
          python3 tools/apply-market-pipeline-fix.py
          git checkout -- .github/workflows/amyfx-blueprint-preview-release.yml 2>/dev/null || true
          git checkout -- .github/workflows/build-apk.yml 2>/dev/null || true
          rm -rf tools/__pycache__
          python3 - <<'PY'
          from pathlib import Path
          heat=Path('tests/dynamic-heatmap-ui-regression.test.mjs')
          if heat.exists():
              text=heat.read_text().replace('assert.match(contract, /source: "M1_QUOTE"/);','assert.match(contract, /source: "(?:TWELVEDATA_WEBSOCKET|MAPPING_REST_FALLBACK)"/);')
              heat.write_text(text)
          for p in Path('tests').glob('*.test.mjs'):
              text=p.read_text()
              text=text.replace(r'2\.0\.0-preview\.292', r'2\.0\.0-preview\.293')
              text=text.replace('2.0.0-preview.292', '2.0.0-preview.293')
              text=text.replace('940292', '940293')
              p.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed JavaScript
        run: |
          node --check app/src/main/assets/apps/mapping/js/api/live-price-websocket.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/main.js
          node --check app/src/main/assets/apps/mapping/js/bridge/android-bridge.js
          node --check app/src/main/assets/apps/mapping/js/ui/ui-render.js
          node --check app/src/main/assets/apps/shared/amyfx-market-state-contract-v1.js
      - name: Commit preview runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: separate live WebSocket and deduplicate market candles [market-pipeline-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
