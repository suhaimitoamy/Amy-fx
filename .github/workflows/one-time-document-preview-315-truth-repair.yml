name: Document Preview 315 Mapping Truth Repair

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-document-preview-315-truth-repair.yml

permissions:
  contents: write

jobs:
  document-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify Preview branch and active release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"
          test "$(python3 -c "import json; print(json.load(open('preview-update.json'))['latest_version_code'])")" = "940315"

      - name: Write truthful manifest and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('preview-update.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['release_notes'] = [
              'Valid Break kini membaca schema struktur modern dan legacy secara konsisten; BOS/MSS terkonfirmasi tidak lagi hilang karena renderer membaca field lama.',
              'Tulisan Data belum cukup hanya muncul bila jumlah candle benar-benar kurang; error analisis dengan 300 candle sekarang ditampilkan sebagai error yang sebenarnya.',
              'Freshness candle ditentukan dari timestamp candle terakhir tertutup, bukan hanya waktu fetch, sehingga 300 candle lama tidak dapat disebut data terbaru.',
              'Keterlambatan provider ditampilkan sebagai CANDLE TERTUNDA beserta jumlah bar dan tidak disamarkan menjadi CANDLE TERTUTUP.',
              'Kegagalan refresh timeframe aktif tidak lagi disembunyikan dari data warning.',
              'Direction Forecast, Mapping Accuracy V3, rumus Entry/SL/TP, lifecycle, package, signer, dan data pengguna tidak diubah.'
          ]
          manifest['changelog'] = [
              'Modern and legacy structure-break schema resolver',
              'Truthful all-timeframe candle and analysis status',
              'Closed-candle timestamp freshness validation',
              'Provider delay visibility and active-timeframe warning',
              'Regression coverage for break and candle truth'
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          text = readme_path.read_text(encoding='utf-8')
          text = text.replace('2.0.0-preview.314', '2.0.0-preview.315')
          text = text.replace('940314', '940315')
          text = text.replace('## Status Release `.314`', '## Status Release `.315`')
          old = """Preview `.315` menambahkan konteks Mapping yang lebih lengkap tanpa memberikan otoritas entry kepada indikator mentah. Formula Direction Forecast, Mapping Accuracy V3, entry, Stop Loss, Take Profit, dan lifecycle setup tidak diubah.

Perubahan utama:

- kontrak bukti `RAW_OBSERVATION`, `VALIDATED_CONTEXT`, `VALIDATED_CLAIM`, dan `EXECUTION_AUTHORITY`;
- sesi London dan New York mengikuti timezone pasar serta perubahan BST/GMT dan EDT/EST secara otomatis, lalu ditampilkan dalam WITA;
- Previous Month High dan Previous Month Low sebagai external-liquidity context;
- Strong/Weak High-Low berdasarkan protected structure dan active liquidity;
- New York Midnight Open departure/retest sebagai konteks;
- audit freshness untuk mencegah zona yang sudah tersentuh atau termitigasi disebut fresh-at-snapshot;
- adaptive EQH/EQL per timeframe sebagai advisory experiment;
- alternatif origin Order Block dalam causal impulse leg sebagai advisory review.

Adaptive EQH/EQL dan alternatif origin Order Block **belum mengganti logika produksi**. Keduanya hanya mengeluarkan metadata eksperimen sampai memiliki validasi out-of-sample yang cukup."""
          new = """Preview `.315` memperbaiki ketidakjujuran antara data candle, detector struktur, dan tampilan Mapping. Perbaikan ini tidak memaksa arah BUY/SELL; tujuannya memastikan UI menampilkan hasil engine dan kondisi sumber candle yang sebenarnya.

Perubahan utama `.315`:

- panel Valid Break membaca schema struktur modern (`concept`, `direction`, `level`, `status`) maupun schema legacy;
- BOS/MSS terkonfirmasi tidak lagi hilang hanya karena renderer mencari field lama;
- `Data belum cukup` hanya digunakan bila candle tertutup benar-benar kurang dari minimum;
- bila 300 candle tersedia tetapi analisis gagal, UI menampilkan `Analisis gagal meski 300 candle tersedia` beserta error sebenarnya;
- freshness memakai timestamp candle tertutup terbaru, bukan waktu fetch request;
- provider yang tertinggal ditampilkan sebagai `CANDLE TERTUNDA N BAR` dan tidak disamarkan menjadi `CANDLE TERTUTUP`;
- kegagalan refresh timeframe aktif ikut diteruskan sebagai warning;
- perubahan konteks `.314`—DST-aware session, PMH/PML, Strong/Weak High-Low, Midnight Open, evidence contract, dan advisory experiments—tetap dipertahankan.

Direction Forecast, Mapping Accuracy V3, rumus Entry, Stop Loss, Take Profit, target struktural, lifecycle setup, Execution Authority, package, signer, dan data pengguna tidak diubah."""
          if old not in text:
              raise SystemExit('README .314 release block was not found after identity replacement')
          readme_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-document-preview-315-truth-repair.yml

      - name: Update immutable release presentation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preview-315-notes.md <<'NOTES'
          Amy FX Preview 2.0.0-preview.315 — Mapping Truth Repair.

          - Valid Break membaca schema struktur modern dan legacy secara konsisten.
          - BOS/MSS terkonfirmasi tidak lagi hilang karena renderer membaca field lama.
          - `Data belum cukup` hanya muncul ketika jumlah candle benar-benar kurang.
          - Error analisis dengan 300 candle ditampilkan sebagai error sebenarnya.
          - Freshness memakai timestamp candle terakhir tertutup, bukan hanya waktu fetch.
          - Provider yang tertinggal ditampilkan sebagai `CANDLE TERTUNDA N BAR`.
          - Direction Forecast, Mapping Accuracy V3, Entry/SL/TP, lifecycle, package, signer, dan data pengguna tidak diubah.
          - Branch `main` tidak diubah.
          NOTES
          gh release edit amyfx-blueprint-preview-2.0.0-preview.315 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Amy FX Preview 2.0.0-preview.315 — Mapping Truth Repair' \
            --notes-file /tmp/preview-315-notes.md

      - name: Validate and commit truthful documentation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-time-document-preview-315-truth-repair.yml
          python3 -m json.tool preview-update.json >/dev/null
          grep -Fq '2.0.0-preview.315' README.md
          grep -Fq 'CANDLE TERTUNDA' README.md
          grep -Fq 'Valid Break kini membaca schema struktur modern' preview-update.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "docs(preview): document 2.0.0-preview.315 Mapping truth repair [skip ci]"
          git push origin HEAD:personal/amyfx-private
