name: Apply and validate journal background video bridge

on:
  push:
    branches:
      - feature/journal-video-background-playback-20260725

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/journal-video-background-playback-20260725
          fetch-depth: 0

      - name: Apply deterministic patches
        run: |
          if grep -Fq 'beginBackgroundVideoTransfer' app/src/main/java/com/amyelitesuite/MainActivity.kt; then
            echo 'Background video bridge already applied.'
          else
            python3 tools/apply_background_video_bridge.py
          fi
          if grep -Fq 'let resumedInWebView = false' app/src/main/assets/apps/journal/background-video.js; then
            echo 'Background resume safeguard already applied.'
          else
            python3 tools/fix_background_video_resume.py
          fi

      - name: Validate generated source
        run: |
          node --check app/src/main/assets/apps/journal/app.js
          node --check app/src/main/assets/apps/journal/background-video.js
          node --test tests/background-video-playback-regression.test.mjs
          git diff --check

      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'Amy FX Background Video Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/amyelitesuite/MainActivity.kt app/src/main/assets/apps/journal/index.html app/src/main/assets/apps/journal/background-video.js
          git commit -m 'fix(journal): preserve native playback if web resume is blocked'
          git push origin HEAD:feature/journal-video-background-playback-20260725

      - name: Run complete JavaScript regression
        run: timeout 10m npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --no-configuration-cache --stacktrace

      - name: Run Android release unit tests
        run: ./gradlew testReleaseUnitTest --no-configuration-cache

      - name: Run Android release lint
        run: ./gradlew lintRelease --no-configuration-cache

      - name: Build release APK
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace
