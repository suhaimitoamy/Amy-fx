name: Stage Preview 315 Mapping Truth Release

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - .github/workflows/one-time-preview-315-mapping-truth-release.yml

permissions:
  contents: write

jobs:
  bump-preview-version:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Verify isolated Preview identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "personal/amyfx-private"
          test "$(git branch --show-current)" != "main"
          grep -Fq "name: '2.0.0-preview.314', code: 940314" app/src/main/assets/app-version.js
          grep -Fq '?: 940314)' app/build.gradle.kts
          grep -Fq '?: "2.0.0-preview.314"' app/build.gradle.kts
          test "$(python3 -c "import json; print(json.load(open('preview-update.json'))['latest_version_code'])")" = "940314"

      - name: Bump Preview identity atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('app/src/main/assets/app-version.js')
          text = version.read_text(encoding='utf-8')
          text = text.replace(
              '// Amy FX Preview 314 — validated mapping context enhancements; execution authority remains setup-only.',
              '// Amy FX Preview 315 — truthful break detection and closed-candle source status.'
          )
          text = text.replace(
              "name: '2.0.0-preview.314', code: 940314",
              "name: '2.0.0-preview.315', code: 940315"
          )
          version.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('?: 940314)', '?: 940315)')
          text = text.replace('?: "2.0.0-preview.314"', '?: "2.0.0-preview.315"')
          gradle.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-preview-315-mapping-truth-release.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify identity and regressions
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-time-preview-315-mapping-truth-release.yml
          grep -Fq "name: '2.0.0-preview.315', code: 940315" app/src/main/assets/app-version.js
          grep -Fq '?: 940315)' app/build.gradle.kts
          grep -Fq '?: "2.0.0-preview.315"' app/build.gradle.kts
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/apps/mapping/js/api/market-data.js
          node --check app/src/main/assets/apps/mapping/js/mapping-integrity.js
          node --test tests/closed-candle-source-state.test.mjs tests/mapping-break-and-timeframe-truth.test.mjs
          timeout 25m npm test

      - name: Commit Preview 315 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(preview): release Mapping truth repair as 2.0.0-preview.315 [skip ci]"
          git push origin HEAD:personal/amyfx-private
