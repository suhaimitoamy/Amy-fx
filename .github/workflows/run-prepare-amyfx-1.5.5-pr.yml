name: Run Amy FX 1.5.5 preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prepare-amyfx-1.5.5.yml
      - .github/workflows/run-prepare-amyfx-1.5.5-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract release patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/prepare-amyfx-1.5.5.yml').read_text(encoding='utf-8').splitlines()
          output = []
          inside = False
          for line in lines:
              if line.strip() == "python3 <<'PY'":
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  output.append(line[10:] if line.startswith('          ') else line)
          if not output:
              raise SystemExit('Patch versi 1.5.5 tidak ditemukan')
          Path('/tmp/prepare-amyfx-1.5.5.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python3 /tmp/prepare-amyfx-1.5.5.py

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/apps/journal/app.js
          python3 -m json.tool update.json >/dev/null
          timeout 10m npm test
          git diff --check

      - name: Commit prepared release
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-amyfx-1.5.5.yml
          rm -f .github/workflows/run-prepare-amyfx-1.5.5-pr.yml
          git config user.name "Amy FX Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Amy FX 1.5.5 (code 46)"
          git push origin "HEAD:${HEAD_BRANCH}"
