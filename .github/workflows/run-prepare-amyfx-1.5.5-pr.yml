name: Run Amy FX 1.5.5 preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prepare-amyfx-1.5.5.yml
      - .github/workflows/run-prepare-amyfx-1.5.5-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate Amy FX 1.5.5 workflows
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-release.yml')
          text = path.read_text(encoding='utf-8')
          if '1.5.4' not in text or 'default: "45"' not in text:
              raise SystemExit('build-release.yml tidak cocok dengan 1.5.4/code 45')
          path.write_text(text.replace('1.5.4', '1.5.5').replace('default: "45"', 'default: "46"'), encoding='utf-8')

          path = Path('.github/workflows/stage5-apply.yml')
          text = path.read_text(encoding='utf-8')
          if '1.5.4' not in text or 'AMYFX_VERSION_CODE: "45"' not in text:
              raise SystemExit('stage5-apply.yml tidak cocok dengan 1.5.4/code 45')
          path.write_text(text.replace('1.5.4', '1.5.5').replace('AMYFX_VERSION_CODE: "45"', 'AMYFX_VERSION_CODE: "46"'), encoding='utf-8')

          path = Path('.github/workflows/build-apk.yml')
          text = path.read_text(encoding='utf-8')
          if '1.5.4' not in text or 'AMYFX_VERSION_CODE: "45"' not in text:
              raise SystemExit('build-apk.yml tidak cocok dengan 1.5.4/code 45')
          text = text.replace('1.5.4', '1.5.5')
          for old, new in {
              'AMYFX_VERSION_CODE: "45"': 'AMYFX_VERSION_CODE: "46"',
              "name: '1.5.5', code: 45": "name: '1.5.5', code: 46",
              "grep -Fq '?: 45)'": "grep -Fq '?: 46)'",
              "'latest_version_code': 45": "'latest_version_code': 46",
              "'versionCode': 45": "'versionCode': 46",
              "\"latest_version_code\": 45": "\"latest_version_code\": 46",
          }.items():
              if old not in text:
                  raise SystemExit(f'build-apk.yml pola hilang: {old}')
              text = text.replace(old, new)

          old_release_notes = 'release_notes="Blok tombol timeframe pada halaman Analisis telah dihapus. Urutan halaman Analisis diperbaiki menjadi: Header harga/status, Asia Liquidity, Market Outlook, Ringkasan Market, Valid Break, Mapping M1–H4, Penjelasan Mapping, Setup Aktif."'
          new_release_notes = 'release_notes="Amy FX 1.5.5 memperbaiki restore backup jurnal dan library berukuran besar, menampilkan progress serta detail error, dan menyimpan backup ZIP dengan nama serta format yang benar. Data lokal, package com.amyelitesuite, jalur update produksi, dan sertifikat permanen tetap dipertahankan."'
          if old_release_notes not in text:
              raise SystemExit('Catatan rilis 1.5.4 tidak ditemukan')
          text = text.replace(old_release_notes, new_release_notes)

          notes_start = text.index('          notes = [')
          notes_end = text.index('          ]\n          data.update({', notes_start) + len('          ]')
          notes_block = """          notes = [
              'Restore backup jurnal dan library berukuran besar kini lebih stabil.',
              'Lampiran dipulihkan bertahap agar WebView tidak memuat seluruh ZIP sekaligus.',
              'Progress restore dan detail error kini ditampilkan.',
              'File yang gagal tidak menghentikan seluruh proses restore.',
              'Backup ZIP disimpan dengan nama, ekstensi, dan format yang benar.',
              'Package com.amyelitesuite, sertifikat permanen, data lokal, dan jalur update tetap dipertahankan.',
              'Pembaruan dapat dipasang tanpa menghapus aplikasi.'
          ]"""
          text = text[:notes_start] + notes_block + text[notes_end:]
          path.write_text(text, encoding='utf-8')
          PY

          mkdir -p release-generated
          cp .github/workflows/build-apk.yml release-generated/build-apk.yml.txt
          cp .github/workflows/build-release.yml release-generated/build-release.yml.txt
          cp .github/workflows/stage5-apply.yml release-generated/stage5-apply.yml.txt
          git restore --source=HEAD -- \
            .github/workflows/build-apk.yml \
            .github/workflows/build-release.yml \
            .github/workflows/stage5-apply.yml
          git diff --check

      - name: Commit generated workflow copies
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "Amy FX Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add release-generated
          git commit -m "chore: generate Amy FX 1.5.5 release workflows"
          git push origin "HEAD:${HEAD_BRANCH}"
