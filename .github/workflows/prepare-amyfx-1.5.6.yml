name: Prepare Amy FX 1.5.6 release

on:
  push:
    branches:
      - release/amyfx-1.5.6
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/amyfx-1.5.6
          fetch-depth: 0
      - name: Apply release preparation
        run: python3 tools/prepare_amyfx_1_5_6.py
      - name: Validate generated release
        run: |
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/apps/journal/app.js
          timeout 10m npm test
          grep -Fq 'AMYFX_VERSION_NAME: "1.5.6"' release-generated/build-apk.yml
          grep -Fq 'AMYFX_VERSION_CODE: "47"' release-generated/build-apk.yml
          grep -Fq 'default: "1.5.6"' release-generated/build-release.yml
          grep -Fq 'default: "47"' release-generated/build-release.yml
          grep -Fq 'AMYFX_VERSION_NAME: "1.5.6"' release-generated/stage5-apply.yml
          grep -Fq 'AMYFX_VERSION_CODE: "47"' release-generated/stage5-apply.yml
          git diff --check
      - name: Commit prepared source and workflow copies
        run: |
          if git diff --quiet; then
            echo "Amy FX 1.5.6 already prepared."
            exit 0
          fi
          git config user.name "Amy FX Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/assets/app-version.js README.md tests release-generated
          git commit -m "release: prepare Amy FX 1.5.6 (code 47)"
          git push origin HEAD:release/amyfx-1.5.6
