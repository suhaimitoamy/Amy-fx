name: Preview Outlook Polish

on:
  push:
    branches:
      - personal/amyfx-private
    paths:
      - scripts/apply-preview-outlook-polish.py
      - .github/workflows/preview-outlook-polish.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: preview-outlook-polish
  cancel-in-progress: true

jobs:
  polish-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private Preview branch
        uses: actions/checkout@v4
        with:
          ref: personal/amyfx-private
          fetch-depth: 0

      - name: Mark source regression pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"pending","context":"Preview Source Regression","description":"Full Node regression is running"}'

      - name: Apply Outlook polish
        run: python3 scripts/apply-preview-outlook-polish.py

      - name: Run full Node regression and capture result
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > preview-outlook-regression.log 2>&1
          status=$?
          echo "$status" > preview-outlook-regression.status
          cat preview-outlook-regression.log
          exit 0

      - name: Publish regression status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status="$(cat preview-outlook-regression.status)"
          if [ "$status" = "0" ]; then
            state="success"
            description="Full Node regression passed"
          else
            state="failure"
            description="Full Node regression failed; report committed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"Preview Source Regression\",\"description\":\"$description\"}"

      - name: Commit successful source or isolated failure report
        shell: bash
        run: |
          status="$(cat preview-outlook-regression.status)"
          rm -f preview-outlook-regression.status
          rm -f scripts/apply-preview-outlook-polish.py
          rm -f .github/workflows/preview-outlook-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" = "0" ]; then
            rm -f preview-outlook-regression.log
            git add -A
            git commit -m "fix(mapping): polish scalping outlook tracking [skip ci]"
          else
            git checkout -- app/src/main/assets/apps/mapping/js/outlook/v2/projection.js
            git checkout -- app/src/main/assets/apps/mapping/js/outlook/v2/tracker.js
            git checkout -- app/src/main/assets/apps/mapping/js/api/market-data.js
            git add -A
            git commit -m "test(mapping): capture Outlook full-regression failure [skip ci]"
          fi
          git push origin HEAD:personal/amyfx-private
